[alias]
# cargo xtask layers  (ECO.REPO.LAYERS)
# cargo xtask lint-crate-graph  (CORE.BUS.LINT)
# cargo xtask kernel-allow [--workspace <dir>] [--map <layers.toml>] [--allowlist <toml>]  (ECO.REPO.ALLOW)
# cargo xtask datasets-check --catalogue <toml> --domains <file>  (ECO.DATA.CAT)
# cargo xtask data fetch (<id>...|--all|--owner <DOMAIN>) [--cache <dir>] [--offline]  (ECO.DATA.FETCH)
# cargo xtask data path <id> [--cache <dir>] [--offline] | cargo xtask data verify [--cache <dir>]  (ECO.DATA.FETCH)
# cargo xtask ci-plan --config <ci-gates.toml> --changed <file> [--json]  (ECO.CI.GATES)
# cargo xtask bots-check --register <toml> --restricted <txt> --today <date> [--review-export <json>]  (ECO.CI.BOTS.REG)
# cargo xtask plat-matrix validate <file>  (PLAT.MATRIX.FILE)
# cargo xtask plat-matrix lint-tiers [<file>]  (PLAT.MATRIX.POLICY.DEFS)
# cargo xtask plat-hw validate [--file <path>]  (PLAT.HW.PROFILE)
# cargo xtask plat-gpu validate [--policy <file>] [--known-bad <file>] [--matrix <file>] [--phase <P>]  (PLAT.GPU.POLICY)
# cargo xtask plat-deploy validate-layout [--file <toml>] [--matrix <toml>] [--phase <P>]  (PLAT.DEPLOY.NOADMIN.LAYOUT)
# cargo xtask plat-hw validate-suite [--file <path>]  (PLAT.HW.SCHEMA)
# cargo xtask plat-hw result-schema  (PLAT.HW.SCHEMA)
# cargo xtask plat-deploy netlist --manifest <json> --settings <json> [--check]  (PLAT.DEPLOY.OFFLINE.NETLIST)
# cargo xtask apps-policy --workspace <dir> --registry-manifests <dir> --apps-status <json> [--config <toml>]  (ECO.APPS.POLICY)
# cargo xtask personas-check [--personas <json>] [--apps <toml>]  (FLOW.PERSONA.PERS)
# cargo xtask study-tasks-check [--tasks <json>] [--maps <dir>] [--personas <json>] [--protocol <md>]  (FLOW.STUDY.PROTO)
# cargo xtask mig ladder-check --ladder <json> --manifest <json>  (MIG.LADDER.DEF)
# cargo xtask qual vap check-templates --dir <dir> [--catalogue <toml>]  (QUAL.VAP.TPL)
# cargo xtask conic-audit [--dir <dir>] [--audit <toml>] [--report <json>] [--allowlist <toml>] [--previous <toml>]  (KRN.SOLV.CONIC.VEND)
# cargo xtask registry-gate --current <declarations.json> [--baseline <json>] [--release-date <date>]  (CORE.REG.VER.GATE)
# cargo xtask gen-surfaces --manifest <json> --out <dir> [--test-emitter echo]  (AUTO.SURF.GEN)
# cargo xtask surface-check --manifest <json> --generated <dir>  (AUTO.SURF.CHECK)
# cargo xtask crash-harness [--seed N] [--kills N] [--instant K:D] [--power-loss ...]  (CORE.STO.SQL.CRASH)
xtask = "run -q -p fid-xtask --"

# Resolve dependencies to versions whose rust-version fits the workspace MSRV (1.89).
[resolver]
incompatible-rust-versions = "fallback"
