[workspace]
resolver = "2"
# vendor/fid-clarabel/crate: the vendored conic solver (KRN.SOLV.CONIC.PATCH), audited by
# `cargo xtask conic-audit` (KRN.SOLV.CONIC.VEND).
members = ["crates/*", "vendor/fid-clarabel/crate"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/metrologymaven/metrologymaven"

# CONSTITUTION §8: no unsafe, no unwrap/expect/panic in non-test code.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Style lints that only start firing because the MSRV moved from 1.81 to 1.87
# (`is_multiple_of` and `Option::is_none_or` became usable). Allowed so the MSRV bump does
# not rewrite unrelated crates; a follow-up PR may adopt the newer APIs and drop these.
manual_is_multiple_of = "allow"
unnecessary_map_or = "allow"
# Same for the move from 1.87 to 1.89 (RUSTSEC-2026-0459): `slice::as_chunks` (1.88) makes
# clippy suggest it over `chunks_exact` with a constant size. Allowed for the same reason.
chunks_exact_to_as_chunks = "allow"
