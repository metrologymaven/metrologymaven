class = "M1"
human_only = true
reason = "Class not stated; arming starts machine motion, so M1 assumed [unverified]."

[[override]]
command = "cmm.record_run@1"
owner = "CMM.EXEC.RECORD"
class = "W2"
human_only = true
reason = "Class not stated; a journaled run record, W2 assumed [unverified]. The step's actor is system (the Motion Executive). QUESTION: human_only is conservative here and may be wrong for a system-written record."

[[override]]
command = "sign.sign_package@1"
owner = "TRUST.ESIG.CEREMONY"
