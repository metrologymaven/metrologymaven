# Reviewed side-effect classes for persona-map commands whose owner node has no `side_effect:`
# frontmatter yet (FLOW.PERSONA.MAPS). Read by tools/check_persona_maps.py: a map step whose
# command has no declared class must appear here, or the check reports MAP-CLASS-UNKNOWN.
#
# `class` is the class stated in the owner node's body where it states one; otherwise it is an
# assumption marked [unverified] in `reason`. Every entry uses the conservative choice
# `human_only = true` until the owner node declares its class; the map step must match.
# Remove an entry once its owner declares `side_effect:` (the check then reports it as stale).
# Maintainer questions are marked "QUESTION:".

[[override]]
command = "cmm.generate_program_from_pmi@1"
owner = "CMM.GEN.PMI"
class = "W2"
human_only = true
reason = "Body states W2 (draft). Conservative human_only until declared; the node lets an agent propose the draft, so QUESTION: should this step allow an agent?"

[[override]]
command = "cmm.simulate_program@1"
owner = "CMM.SIM.RUN"
class = "I1"
human_only = true
reason = "Body states I1 and REQ-CMM.SIM.RUN-005 exposes it to agents over MCP. QUESTION: human_only conflicts with that projection; kept conservative until a maintainer decides."

[[override]]
command = "cmm.request_run@1"
owner = "CMM.EXEC.REQ"
class = "M1"
human_only = true
reason = "Body states M1, request only, never projected to MCP; agents never perform M1 (CONSTITUTION 3)."

[[override]]
command = "cmm.approve_ticket@1"
owner = "CMM.EXEC.AUTHN"
class = "M1"
human_only = true
reason = "REQ-CMM.EXEC.AUTHN-005: class M1, station only, never on MCP (gate H1)."

[[override]]
command = "device.connect_cmm@1"
owner = "HAL.IPP.SESS"
class = "D1"
human_only = true
reason = "Body states D1, request-only on MCP. human_only is the conservative choice; QUESTION: may an agent request the connection?"

[[override]]
command = "cmm.confirm_setup_run@1"
owner = "CMM.EXEC.SCOPE"
class = "W2"
human_only = true
reason = "Body states human only (setup-run confirmation by a human); class not stated, W2 assumed [unverified]."

[[override]]
command = "cmm.arm_run@1"
