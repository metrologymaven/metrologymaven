# Dataset catalogue (spec node ECO.DATA.CAT). Every public dataset the project uses for
# tests, benchmarks and examples, with source, licence, size, SHA-256, owning level-1
# domain and redistribution status. Checked in CI by `cargo test -p fid-data` (and by
# hand with `cargo xtask datasets-check --catalogue datasets.toml --domains <file>`).
#
# Admission rules: a `mirror` entry needs a licence expression satisfiable from
# `[policy] redistributable`; otherwise mark it `fetch-only` from its original source.
# No standards text, and no customer data without a written release (`release_ref`).
#
# Third-party reference data (NIST, PTB, TraCIM and similar) is NOT listed: its terms are
# unresolved in decision D-038. Add such entries only once D-038 settles them.
#
# The entries below are project-made files already in this repository (CC-BY-4.0 project
# data per LICENSE.md). Digests are of the files as committed (LF line endings).

# Proposal from spec/eco/data/cat/NODE.md; maintainers confirm in review.
[policy]
redistributable = ["CC0-1.0", "CC-BY-4.0", "CC-BY-SA-4.0", "MIT", "Apache-2.0", "BSD-3-Clause", "ODbL-1.0", "PDDL-1.0"]

