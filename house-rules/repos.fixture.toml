# Stand-in repository map until repos.toml (spec node ECO.REPO.TOPO) exists at the
# repository root. Same shape as that map: [[repo]] id, url, purpose, protected_tags.
# Today the spec tree and the Rust crates share one git repository; the two entries
# keep the spec-only and code-only blocks apart for when they are split.

[[repo]]
id = "spec"
url = "https://github.com/metrologymaven/metrologymaven"
purpose = "Specification tree, decisions and spec tooling"
protected_tags = false

[[repo]]
id = "code"
url = "https://github.com/metrologymaven/metrologymaven"
purpose = "Rust implementation crates"
protected_tags = false
