name: spec-check
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
# A newer push to the same PR or main cancels the older run; merge_group is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate spec tree and coverage
        run: |
          python tools/scope.py check
          python tools/scope.py milestone milestones/launch-1.md
      # D-042: generated/ reports are refreshed on main by a regeneration PR, not in every
      # PR. On pull requests this step only reports staleness; on main it is informational
      # too, so a merge never turns main red before the next regeneration PR lands.
      - name: Generated reports are up to date (informational, D-042)
        continue-on-error: true
        run: git diff --exit-code --stat -- generated/INDEX.md generated/COVERAGE.md generated/DECISIONS.md generated/EXPERT-QUEUE.md generated/BUILT.md generated/milestones/launch-1.md
  grow-tests:
    # ECO.COMM.GROW AC-5: AC-1..AC-4 tests pass on Windows, Linux and macOS in CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ECO.COMM.GROW cross-platform tests
        run: python -m unittest discover -s tools/tests -p "test_grow.py" -v
