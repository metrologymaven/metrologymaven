name: e2e

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "e2e-${{ matrix.os }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Fetch workspace dependencies
        run: cargo fetch --locked
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Run Tier 1-4 E2E suite (strict)
        shell: bash
        run: python e2e/run_e2e.py --strict --out "$RUNNER_TEMP/e2e-report.json"
      - name: Run Tier 5 adversarial E2E suite (strict)
        shell: bash
        run: python e2e/run_e2e.py --strict --tier 5 --out "$RUNNER_TEMP/e2e-tier5-report.json"
      - name: Upload E2E report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/e2e-report.json
            ${{ runner.temp }}/e2e-tier5-report.json
          if-no-files-found: warn
