name: rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push to the same PR cancels the older run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Cargo.lock up to date
        # Blocking: a PR that adds a crate or dependency must update Cargo.lock in the same PR
        # (lockfile workflow, or exact hand-added entries). Main's lock went stale twice while this
        # was informational (#197, #209). Runs before any build touches the lock.
        if: runner.os == 'Linux'
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Working tree is the committed bytes (KRN.MAN.MANI.IMPL REQ-003)
        # Implementation digests hash git-tracked files as they are in the working tree. Before any
        # build, on every OS: the whole checkout is clean, and every file has the same EOL state in
        # the index and the working tree. Files whose attributes deliberately set eol=crlf (Windows
        # scripts) are exempt, unless they lie where the digest reads (crates/, vendor/, .cargo/,
        # Cargo.toml, Cargo.lock), which fails.
        shell: bash
        run: |
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then echo "$dirty"; exit 1; fi
          bad=$(git ls-files --eol | awk -F'\t' '{
            split($1, f, " +"); i = substr(f[1], 3); w = substr(f[2], 3); path = $2
            if (i == w) next
            hashed = (path ~ /^(crates|vendor|\.cargo)\// || path == "Cargo.toml" || path == "Cargo.lock")
            if ($1 ~ /eol=crlf/ && !hashed) next
            print
          }')
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: Fetch dependencies for all targets (ECO.REPO.ALLOW checks every platform offline)
        run: cargo fetch
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Kernel WASM shim with its stand-in test algorithms, natively (KRN.MAN.WASM AC-2)
        run: |
          cargo clippy -p fid-kernel-wasm --all-targets --features test-algorithms -- -D warnings
          cargo test -p fid-kernel-wasm --features test-algorithms
      - name: Site import verify runs with the network cut (OUTR.SITE.GEN.IMPORT AC-7)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build -q -p fid-outreach
          if sudo unshare --net -- curl -sS -m 10 -o /dev/null https://github.com; then exit 1; fi
          stage="$RUNNER_TEMP/site-import-stage"
          sudo unshare --net -- ./target/debug/fid-outreach site import verify --site fixtures/outr/site/import/ok             --stage "$stage" --revision abc123 --revision-date 2026-11-17
          cmp "$stage/build-manifest.json" fixtures/outr/site/import/expected/build-manifest.json
      - name: DMIS conformance table is fresh (IO.DMIS.CONF AC-4)
        # Regenerates docs/dmis/ from the declarations and the real test inventory; fails if stale.
        if: runner.os == 'Linux'
        shell: bash
        # The inventory is `--list` minus `--list --ignored`, with IDs qualified as
        # <package>::<target>::<test>; the probe test checks both properties end to end.
        run: |
          cargo test --workspace --no-run --message-format=json > "$RUNNER_TEMP/cargo-tests.json"
          cargo run -q -p fid-io-dmis --bin dmis-conformance -- inventory \
            --cargo-json "$RUNNER_TEMP/cargo-tests.json" --out "$RUNNER_TEMP/test-inventory.txt"
          grep -qx 'fid-io-dmis::acceptance::ac3_same_inputs_give_identical_bytes: test' "$RUNNER_TEMP/test-inventory.txt"
          if grep -q 'ignored_inventory_probe' "$RUNNER_TEMP/test-inventory.txt"; then exit 1; fi
          cargo run -q -p fid-io-dmis --bin dmis-conformance -- \
            --decl crates/fid-io-dmis/conformance/declarations.toml \
            --tests "$RUNNER_TEMP/test-inventory.txt" --check docs/dmis
      - name: Crate layering (ECO.REPO.LAYERS)
        run: cargo xtask layers
      - name: Kernel-graph dependency allowlist (ECO.REPO.ALLOW)
        run: cargo xtask kernel-allow
      - name: Fuzz harness compiles on stable (AUTO.PROG.FMT AC-6)
        # Running it needs nightly (cargo fuzz); this only keeps the target compiling.
        if: runner.os == 'Linux'
        run: cargo check --manifest-path crates/fid-program/fuzz/Cargo.toml
      - name: XML reader fuzz harness compiles on stable (IO.QIF.XML.PARSE AC-5)
        if: runner.os == 'Linux'
        run: cargo check --manifest-path crates/fid-xml/fuzz/Cargo.toml
      - name: CAD worker protocol fuzz harness compiles on stable (IO.CAD.WORKER.PROTO AC-5)
        if: runner.os == 'Linux'
        run: cargo check --manifest-path crates/fid-cad-proto/fuzz/Cargo.toml
      - name: LAS reader fuzz harness compiles on stable (IO.CLOUD.LAS.HDR AC-5)
        if: runner.os == 'Linux'
        run: cargo check --manifest-path crates/fid-io-las/fuzz/Cargo.toml
      - name: No side doors (CORE.BUS.LINT)
        run: cargo xtask lint-crate-graph
      - name: Dataset catalogue admission check via cargo xtask (ECO.DATA.CAT AC-1)
        run: cargo xtask datasets-check --catalogue fixtures/datasets/valid.toml --domains fixtures/datasets/domains.txt
      - name: Support matrix validates via cargo xtask (PLAT.MATRIX.FILE AC-1)
        shell: bash
        run: |
          out=$(cargo xtask plat-matrix validate fixtures/plat/matrix/valid.toml)
          test "$out" = "6 rows, 0 errors"
          cargo xtask plat-matrix validate platform/support-matrix.toml
      - name: Support matrix page is generated and in sync via cargo xtask (PLAT.MATRIX.PAGE AC-1, AC-3)
        shell: bash
        run: |
          cargo xtask plat-matrix page --matrix fixtures/plat/matrix/valid.toml --out "$RUNNER_TEMP/page.md"
          cmp "$RUNNER_TEMP/page.md" fixtures/plat/matrix/expected-page.md
          cargo xtask plat-matrix page --check --out docs/platform/support-matrix.md
      - name: Hardware profiles validate via cargo xtask (PLAT.HW.PROFILE AC-1 to AC-5)
        shell: bash
        run: |
          out=$(cargo xtask plat-hw validate --file fixtures/plat/hw/profiles-valid.toml)
          test "$out" = "$(printf 'minimum\nrecommended')"
          for f in inverted no-minimum extra-field; do
            set +e; cargo xtask plat-hw validate --file fixtures/plat/hw/profiles-$f.toml; code=$?; set -e
            test "$code" = 1
          done
          cargo xtask plat-hw validate
      - name: GPU policy and known-bad list validate via cargo xtask (PLAT.GPU.POLICY AC-1 to AC-6)
        shell: bash
        run: |
          g=fixtures/plat/gpu
          m="--matrix fixtures/plat/matrix/valid.toml --phase P1a"
          cargo xtask plat-gpu validate --policy $g/policy-valid.toml $m --known-bad $g/known-bad-valid.toml
          set +e; out=$(cargo xtask plat-gpu validate --policy $g/policy-win-no-vulkan.toml $m); code=$?; set -e
          test "$code" = 1 && grep -q '^MissingMandatoryBackend { os: windows, backend: vulkan }' <<< "$out"
          set +e; out=$(cargo xtask plat-gpu validate --policy $g/policy-missing-row.toml $m); code=$?; set -e
          test "$code" = 1 && grep -qx 'NoPolicyRow { os: macos, arch: aarch64 }' <<< "$out"
          set +e; out=$(cargo xtask plat-gpu validate --policy $g/policy-no-software.toml $m); code=$?; set -e
          test "$code" = 1 && grep -q '^NoSoftwareFallback' <<< "$out"
          set +e; out=$(cargo xtask plat-gpu validate --known-bad $g/known-bad-noref.toml); code=$?; set -e
          test "$code" = 1 && grep -qx 'MissingReference { id: fixture-noref }' <<< "$out"
          cargo xtask plat-gpu validate
      - name: Per-user layout validates via cargo xtask (PLAT.DEPLOY.NOADMIN.LAYOUT AC-1, AC-2, AC-4)
        shell: bash
        run: |
          d=fixtures/plat/deploy
          m="--matrix fixtures/plat/matrix/valid.toml --phase P1a"
          out=$(cargo xtask plat-deploy validate-layout $m)
          test "$out" = "layout: 3 os, 0 errors"
          set +e; out=$(cargo xtask plat-deploy validate-layout --file $d/layout-programfiles.toml $m); code=$?; set -e
          test "$code" = 1 && grep -qx 'OutsideProfile { os: windows, entry: install_dir }' <<< "$out"
          set +e; out=$(cargo xtask plat-deploy validate-layout --file $d/layout-missing-macos.toml $m); code=$?; set -e
          test "$code" = 1 && grep -qx 'MissingOs { os: macos }' <<< "$out"
          cargo xtask plat-deploy validate-layout
      - name: Benchmark suite manifest validates via cargo xtask (PLAT.HW.SCHEMA AC-1 to AC-3)
        shell: bash
        run: |
          out=$(cargo xtask plat-hw validate-suite --file fixtures/plat/bench/mini-suite.toml)
          test "$out" = "$(printf 'mini.load\nmini.render')"
          set +e; out=$(cargo xtask plat-hw validate-suite --file fixtures/plat/bench/suite-no-digest.toml); code=$?; set -e
          test "$code" = 1 && test "$out" = "MissingDigest { workload: no-digest.load }"
          set +e; out=$(cargo xtask plat-hw validate-suite --file fixtures/plat/bench/suite-bad-unit.toml); code=$?; set -e
          test "$code" = 1 && grep -q '^BadUnit { workload: bad-unit.load' <<< "$out"
      - name: Network-feature list via cargo xtask (PLAT.DEPLOY.OFFLINE.NETLIST AC-1, AC-2, AC-4)
        shell: bash
        run: |
          d=fixtures/plat/deploy
          net="plat-deploy netlist --manifest $d/manifest-net.json"
          out=$(cargo xtask $net --settings $d/settings-manifest.json \
            --json $d/network-features.json --md $d/network-features.md --check)
          test "$out" = "netlist: 3 commands, up to date"
          set +e
          out=$(cargo xtask $net --settings $d/settings-consent-on.json \
            --json "$RUNNER_TEMP/nf.json" --md "$RUNNER_TEMP/nf.md")
          code=$?
          set -e
          test "$code" = 1 && test "$out" = 'X1DefaultOn { command: "update.check@1" }'
      - name: Published keys agree with KEYS.md (ECO.REL.SIGN.GUIDE AC-1)
        run: |
          cargo xtask rel keys-check
          cargo xtask rel keys-check --keys fixtures/rel/guide/keys --doc fixtures/rel/guide/docs/KEYS.md
      - name: Vendored solver audit via cargo xtask (KRN.SOLV.CONIC.VEND AC-1 to AC-5)
        shell: bash
        run: |
          v=fixtures/solv/vend
          out=$(cargo xtask conic-audit --dir $v/ok)
          test "$out" = "conic-audit: ok"
          set +e; out=$(cargo xtask conic-audit --dir $v/drift); code=$?; set -e
          test "$code" = 1 && grep -q '^AUDIT-PATCH-DRIFT crate/src/lib.rs: ' <<< "$out"
          set +e; out=$(cargo xtask conic-audit --dir $v/digest); code=$?; set -e
          test "$code" = 1 && grep -q '^AUDIT-DIGEST upstream/: ' <<< "$out"
          set +e; out=$(cargo xtask conic-audit --dir $v/update --previous $v/ok/AUDIT.toml); code=$?; set -e
          test "$code" = 1 && grep -q '^AUDIT-PATCH-MISSING 0002: ' <<< "$out"
          cargo xtask conic-audit --dir $v/update --audit $v/update/AUDIT-dropped.toml --previous $v/ok/AUDIT.toml
          set +e
          out=$(cargo xtask conic-audit --dir $v/ok --report $v/lint/unwaived-pow.json --audit $v/lint/AUDIT-unwaived-pow.toml)
          code=$?
          set -e
          test "$code" = 1 && test "$out" = 'AUDIT-LINT crate/src/x.rs:6:14: unwaived KNP1-POW finding'
          # The real vendored tree, once it exists (see the leaf's Open questions). vendor/ may
          # hold only the audited real directory fid-clarabel; anything else, a symbolic link
          # (dangling or not, where `[ -e ]` alone is false) or vendor/ being a link fails.
          if [ -L vendor ]; then echo "::error::vendor/ is a symbolic link"; exit 1; fi
          if [ -e vendor ]; then
            if [ ! -d vendor ]; then echo "::error::vendor is not a directory"; exit 1; fi
            shopt -s nullglob dotglob
            for e in vendor/*; do
              if [ -L "$e" ] || [ "$e" != vendor/fid-clarabel ] || [ ! -d "$e" ]; then
                echo "::error::$e is not an audited vendored directory"; exit 1
              fi
            done
            if [ -d vendor/fid-clarabel ]; then cargo xtask conic-audit; fi
          fi
      - name: Tier definitions table is complete (PLAT.MATRIX.POLICY.DEFS AC-1)
        run: cargo xtask plat-matrix lint-tiers
      - name: Study task list and protocol check via cargo xtask (FLOW.STUDY.PROTO AC-1, AC-3)
        run: cargo xtask study-tasks-check
      - name: Second implementation reproduces the canonical-JSON vectors (CORE.JRN.CANON AC-2)
        run: node fixtures/core/jrn/canon/runner.mjs
      - name: CLI smoke test
        shell: bash
        run: |
          out=$(echo '{"b":1,"a":[1e21,0.1]}' | cargo run -q -p fid-cli -- canon)
          test "$out" = '{"a":[1e+21,0.1],"b":1}'
          echo '{"b":1}' | cargo run -q -p fid-cli -- canon --json > ok.json
          cat ok.json
          grep -q '"outcome":"computed"' ok.json
          if echo '{"a":1,"a":2}' | cargo run -q -p fid-cli -- canon --json > bad.json; then exit 1; fi
          grep -q '"canon_error":"duplicate_key"' bad.json
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Envelopes validate against schema/envelope-v1.json (AUTO.SURF.ENV AC-1)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --quiet jsonschema
          python tools/check_envelopes.py ok.json bad.json
          python fixtures/plat/bench/make_expected.py --check
          python fixtures/plat/deploy/make_expected.py --check
          python fixtures/plat/matrix/make_page.py --check
          python fixtures/rel/runbook/make_fixtures.py --check
          python fixtures/rel/sbom/make_fixtures.py --check
          python fixtures/rel/guide/make_fixtures.py --check
          python fixtures/dsse/make_fixtures.py --check
          python fixtures/io/reg/env/report/make_fixtures.py --check
          python fixtures/io/cad/worker/proto/make_digests.py --check
          python tools/check_bench_schema.py
          python tools/check_command_defs.py
          python fixtures/core/reg/def/guide/make_fixtures.py --check
          python tools/check_entries.py
          python tools/check_knp1_findings.py fixtures/solv/vend/*/knp1-findings.json fixtures/solv/vend/lint/*.json
          python fixtures/solv/vend/make_fixtures.py --check
          python fixtures/solv/make_mstart_fixtures.py --check
          python tools/check_eval_suite.py
          python fixtures/pkg/make_fixtures.py --check
          python fixtures/io/dmis/conf/make_expected.py --check
          python fixtures/io/e57/phys/make_fixtures.py --check
          python fixtures/io/cloud/las/hdr/make_fixtures.py --check
          python fixtures/flow/study/tasks/make_fixtures.py --check
          python fixtures/flow/pkg/make_fixtures.py --check
          python fixtures/flow/journey/make_fixtures.py --check
          python fixtures/flow/fixes/make_fixtures.py --check
          python fixtures/outr/site/import/make_fixtures.py --check
          python fixtures/outr/bench/recipe/make_fixtures.py --check
          python fixtures/program/expr/make_cases.py --check
          python fixtures/agent/harness/runs/make_runs.py --check
          python fixtures/io/qif/xml/parse/make_fixtures.py --check
          python fixtures/auto/cli/out/make_cases.py --check
          python fixtures/fetch/make_fixtures.py --check
          python fixtures/hal/idl/stamp/make_fixtures.py --check
          python fixtures/hal/idl/base/cfg/make_fixtures.py --check
          python fixtures/hal/idl/base/err/make_fixtures.py --check
          python fixtures/core/sto/sql/schema/make_fixture.py --check
          python fixtures/mig/ladder/def/make_fixtures.py --check
          python fixtures/man/make_manifest_fixtures.py --check
          python fixtures/man/check_manifest_schema.py
          python fixtures/man/wasm/make_fixtures.py --check
          python fixtures/man/make_implclosure_fixtures.py --check
          python fixtures/num/make_red_fixtures.py --check
          python fixtures/num/fmt/make_len_fixtures.py --check
          python fixtures/num/fmt/make_ang_fixtures.py --check
          python fixtures/num/la/make_la_fixtures.py --check
          python tools/fixtures/geo_sel_sets.py --check
          python fixtures/core/reg/ver/compat/make_fixtures.py --check
          python fixtures/core/reg/ver/gate/make_fixtures.py --check
          python fixtures/geo/types/make_mesh_fixtures.py --check
          python tools/fixtures/geo_digest_vectors.py --check
          python fixtures/scan/cmp/make_field_golden.py --check
          python fixtures/pkg/check_package.py --strict
          python -m unittest discover -s tools/house_rules/tests -v
          python -m unittest discover -s tools/tests -v
          python -m unittest discover -s tools/repo_template/tests -v
      - name: Contributor guide passes claim lint and its commands run (OUTR.DOCS.CONTRIB AC-6, AC-1, AC-3)
        # The committed guide states the main commit it was written against; a commit cannot name
        # itself, so the guide is checked as a copy stating this checkout's HEAD.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -q -p fid-brand-lint -- claim-lint --rules crates/fid-brand-lint/rules/claim-rules.toml docs/contributor/guide.md
          guide="$RUNNER_TEMP/contributor-guide.md"
          sed "s/^revision: .*/revision: $(git rev-parse HEAD)/" docs/contributor/guide.md > "$guide"
          before=$(git status --porcelain)
          cargo run -q -p fid-outreach -- doc-run --guide "$guide" --repo .
          test "$before" = "$(git status --porcelain)"
      - name: Repository template code variant passes clippy (ECO.REPO.TPL.FILES AC-4)
        # +stable overrides the template's rust-toolchain.toml pin so no extra toolchain is installed.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="$RUNNER_TEMP/tpl-code"
          PYTHONPATH=tools python -m repo_template new --id fid-demo --variant code \
            --rules-source fixtures/repo/tpl/rules \
            --rules-rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --ci-rev bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb --year 2026 --out "$out"
          cd "$out"
          grep -q '^"starter" = ' layers.toml
          cargo +stable clippy --workspace --all-targets -- -D warnings
          cargo +stable test --workspace
  verify-guide:
    # ECO.REL.SIGN.GUIDE AC-3: the command blocks of VERIFY.md run verbatim on each Tier 1 OS
    # family against fixtures/rel/guide/release/; a copy with one changed byte must fail. The
    # network is cut where a hosted runner allows it: Linux runs in a new network namespace,
    # macOS under a sandbox profile that denies network access; Windows has no such switch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: verify-linux
          - os: windows-latest
            tag: verify-windows
          - os: macos-latest
            tag: verify-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Follow VERIFY.md (${{ matrix.tag }})
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              offline() { sudo unshare --net -- "$@"; }
              py=python3 ;;
            macOS)
              offline() { sandbox-exec -p '(version 1)(allow default)(deny network*)' "$@"; }
              py=python3 ;;
            *)
              offline() { "$@"; }
              py=python ;;
          esac
          if [ "$RUNNER_OS" != Windows ]; then
            # The isolation really cuts the network.
            if offline curl -sS -m 10 -o /dev/null https://github.com; then exit 1; fi
          fi
          offline "$py" tools/verify_guide.py --tag "${{ matrix.tag }}"
  msrv:
    # rust-version = 1.89 (Cargo.toml). Cargo 1.89 honours the [resolver] key in
    # .cargo/config.toml; the stable and lockfile jobs resolve MSRV-aware too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.89"
      - name: Check on MSRV 1.89
        run: cargo check --workspace --all-targets
  deny:
    # Licences, advisories, bans, sources (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check all
  wasm32:
    # CONSTITUTION §4: bit-identity on wasm32 (KRN.NUM.ERR AC-2, KRN.NUM.RNG AC-2).
    # Test binaries run under wasmtime; the workspace is mapped at its own absolute
    # path so fixture paths built from CARGO_MANIFEST_DIR resolve inside the guest.
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}::${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - name: Install wasmtime v49.0.6 (tarball SHA-256 pinned and verified before use)
        # Same release the bytecodealliance setup action installed; the digest is the one GitHub
        # records for the release asset. KRN.MAN.WASM pins this version in wasm-runtime.toml.
        shell: bash
        env:
          WASMTIME_TARBALL: wasmtime-v49.0.6-x86_64-linux.tar.xz
          WASMTIME_SHA256: 15625b129e54534793dc77965d6912a5307db8e8e90ee114f52ef62ce6e4f918
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/wasmtime"
          mkdir -p "$d"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o "$d/$WASMTIME_TARBALL" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.6/$WASMTIME_TARBALL"
          echo "$WASMTIME_SHA256  $d/$WASMTIME_TARBALL" | sha256sum --check --strict -
          tar -xJf "$d/$WASMTIME_TARBALL" -C "$d"
          echo "$d/wasmtime-v49.0.6-x86_64-linux" >> "$GITHUB_PATH"
      - run: wasmtime --version
      - name: Test kernel and core crates on wasm32-wasip1
        run: cargo test --target wasm32-wasip1 -p fid-num -p fid-canon -p fid-kci -p fid-replay -p fid-surface -p fid-types -p fid-sign-core -p fid-solv
      - name: Implementation digests are bit-identical on wasm32-wasip1 (KRN.MAN.MANI.IMPL AC-1, build-time tool)
        run: cargo test --target wasm32-wasip1 -p fid-manifest-gen
      - name: Element digest vectors on wasm32-wasip1 (GEO.TYPES.DIGEST AC-1)
        run: cargo test --target wasm32-wasip1 -p fid-geo-types --test digest
      - name: Selection index-set digests on wasm32-wasip1 (GEO.SEL.MODEL AC-1)
        run: cargo test --target wasm32-wasip1 -p fid-geo-sel --test model
      - name: Deviation field digest and golden vectors on wasm32-wasip1 (SCAN.CMP.DEV.FIELD AC-1, AC-4)
        run: cargo test --target wasm32-wasip1 -p fid-scan-cmp --lib
      - name: Kernel WASM reference module, import allowlist and golden calls (KRN.MAN.WASM AC-1 to AC-3)
        # Uses only what this job already installs (the wasm32-wasip1 target and the pinned
        # wasmtime). The reference module registers no algorithm until fid-kernel exists; a
        # second build registers the stand-in test algorithms the fixtures call. The linked
        # modules are sealed (clock imports renamed to trap); the sealed module is the artifact.
        shell: bash
        run: |
          set -euo pipefail
          c=crates/fid-kernel-wasm
          w=fixtures/man/wasm
          cargo build -q --release --target wasm32-wasip1 -p fid-kernel-wasm
          cargo build -q --release --target wasm32-wasip1 -p fid-kernel-wasm --features test-algorithms --target-dir target/wasm-test
          cargo build -q -p fid-wasm-check
          chk=target/debug/fid-wasm-check
          # The wasmtime options the runner passes exist in this wasmtime (for the record).
          wasmtime run -W help | grep -E 'nan-canonicalization|relaxed-simd|threads|max-wasm-stack|max-memory-size|trap-on-grow-failure|fuel|unknown-imports-trap' || true
          ref="$RUNNER_TEMP/fid-kernel-wasm.wasm"
          tst="$RUNNER_TEMP/fid-kernel-wasm-test.wasm"
          $chk seal target/wasm32-wasip1/release/fid-kernel-wasm.wasm "$ref"
          $chk seal target/wasm-test/wasm32-wasip1/release/fid-kernel-wasm.wasm "$tst"
          sha256sum "$ref" "$tst"
          # The reference module carries no stand-in test algorithm; the test module does.
          if grep -q 'test.stack.recurse' "$ref"; then echo "::error::stand-ins in the reference module"; exit 1; fi
          grep -q 'test.stack.recurse' "$tst"
          $chk runtime-digest $c/wasm-runtime.toml > "$RUNNER_TEMP/runtime-digest.txt"
          cmp "$RUNNER_TEMP/runtime-digest.txt" $w/runtime-digest.txt
          # AC-1: the sealed modules import only allowlisted functions (the clock is `trapped`) ...
          $chk imports "$ref" $c/wasm-imports.allow
          $chk imports "$tst" $c/wasm-imports.allow
          # ... the unsealed link output is refused (its clock import is not allowlisted) ...
          set +e; $chk imports target/wasm32-wasip1/release/fid-kernel-wasm.wasm $c/wasm-imports.allow; code=$?; set -e
          test "$code" = 1
          # ... and a module importing random_get fails, naming the import.
          set +e; out=$($chk imports $w/modules/bad-random-get.wasm $c/wasm-imports.allow); code=$?; set -e
          echo "$out"
          test "$code" = 1 && grep -qx 'DENIED wasi_snapshot_preview1 random_get (func)' <<< "$out"
          # AC-2 and AC-3: every call through the module under the pinned settings.
          $chk golden $c/wasm-runtime.toml $c/wasm-imports.allow "$tst" $w/calls-v1.txt
          # The reference module answers through the same runner (no algorithms registered yet).
          call='{"algorithm":"test.echo.identity@1.0.0","inputs":[],"params":""}'
          set +e; out=$(printf '%s' "$call" | $chk run $c/wasm-runtime.toml $c/wasm-imports.allow "$ref"); code=$?; set -e
          test "$code" = 1 && test "$out" = '{"error":"unknown_algorithm"}'
          # clock = "trap": a sealed module that calls the clock is NOT_REPLAYABLE(trap) ...
          $chk seal $w/modules/clock-call.wasm "$RUNNER_TEMP/clock.wasm"
          cmp "$RUNNER_TEMP/clock.wasm" $w/modules/clock-call.sealed.wasm
          set +e; out=$(printf '' | $chk run $c/wasm-runtime.toml $c/wasm-imports.allow "$RUNNER_TEMP/clock.wasm"); code=$?; set -e
          test "$code" = 4 && test "$out" = 'NOT_REPLAYABLE(trap)'
          # ... and the unsealed one is refused before it runs.
          set +e; printf '' | $chk run $c/wasm-runtime.toml $c/wasm-imports.allow $w/modules/clock-call.wasm; code=$?; set -e
          test "$code" = 5
          # Fuel: a module that loops forever ends as NOT_REPLAYABLE(resource).
          set +e; out=$(printf '' | $chk run $c/wasm-runtime.toml $c/wasm-imports.allow $w/modules/loop.wasm); code=$?; set -e
          test "$code" = 3 && test "$out" = 'NOT_REPLAYABLE(resource)'
