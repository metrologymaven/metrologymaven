name: rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Cargo.lock up to date (informational)
        # Non-blocking: builder PRs may add crates without refreshing Cargo.lock
        # (refresh via the lockfile workflow). Runs before any build touches the lock.
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Crate layering (ECO.REPO.LAYERS)
        run: cargo xtask layers
      - name: Fuzz harness compiles on stable (AUTO.PROG.FMT AC-6)
        # Running it needs nightly (cargo fuzz); this only keeps the target compiling.
        if: runner.os == 'Linux'
        run: cargo check --manifest-path crates/fid-program/fuzz/Cargo.toml
      - name: No side doors (CORE.BUS.LINT)
        run: cargo xtask lint-crate-graph
      - name: Dataset catalogue admission check via cargo xtask (ECO.DATA.CAT AC-1)
        run: cargo xtask datasets-check --catalogue fixtures/datasets/valid.toml --domains fixtures/datasets/domains.txt
      - name: Support matrix validates via cargo xtask (PLAT.MATRIX.FILE AC-1)
        shell: bash
        run: |
          out=$(cargo xtask plat-matrix validate fixtures/plat/matrix/valid.toml)
          test "$out" = "6 rows, 0 errors"
          cargo xtask plat-matrix validate platform/support-matrix.toml
      - name: Hardware profiles validate via cargo xtask (PLAT.HW.PROFILE AC-1 to AC-5)
        shell: bash
        run: |
          out=$(cargo xtask plat-hw validate --file fixtures/plat/hw/profiles-valid.toml)
          test "$out" = "$(printf 'minimum\nrecommended')"
          for f in inverted no-minimum extra-field; do
            set +e; cargo xtask plat-hw validate --file fixtures/plat/hw/profiles-$f.toml; code=$?; set -e
            test "$code" = 1
          done
          cargo xtask plat-hw validate
      - name: Tier definitions table is complete (PLAT.MATRIX.POLICY.DEFS AC-1)
        run: cargo xtask plat-matrix lint-tiers
      - name: Second implementation reproduces the canonical-JSON vectors (CORE.JRN.CANON AC-2)
        run: node fixtures/core/jrn/canon/runner.mjs
      - name: CLI smoke test
        shell: bash
        run: |
          out=$(echo '{"b":1,"a":[1e21,0.1]}' | cargo run -q -p fid-cli -- canon)
          test "$out" = '{"a":[1e+21,0.1],"b":1}'
          echo '{"b":1}' | cargo run -q -p fid-cli -- canon --json > ok.json
          cat ok.json
          grep -q '"outcome":"computed"' ok.json
          if echo '{"a":1,"a":2}' | cargo run -q -p fid-cli -- canon --json > bad.json; then exit 1; fi
          grep -q '"canon_error":"duplicate_key"' bad.json
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Envelopes validate against schema/envelope-v1.json (AUTO.SURF.ENV AC-1)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --quiet jsonschema
          python tools/check_envelopes.py ok.json bad.json
          python tools/check_command_defs.py
          python tools/check_entries.py
          python tools/check_knp1_findings.py
          python tools/check_eval_suite.py
          python fixtures/pkg/make_fixtures.py --check
          python fixtures/pkg/check_package.py --strict
          python -m unittest discover -s tools/house_rules/tests -v
          python -m unittest discover -s tools/tests -v
          python -m unittest discover -s tools/repo_template/tests -v
      - name: Contributor guide passes claim lint and its commands run (OUTR.DOCS.CONTRIB AC-6, AC-1, AC-3)
        # The committed guide states the main commit it was written against; a commit cannot name
        # itself, so the guide is checked as a copy stating this checkout's HEAD.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -q -p fid-brand-lint -- claim-lint --rules crates/fid-brand-lint/rules/claim-rules.toml docs/contributor/guide.md
          guide="$RUNNER_TEMP/contributor-guide.md"
          sed "s/^revision: .*/revision: $(git rev-parse HEAD)/" docs/contributor/guide.md > "$guide"
          before=$(git status --porcelain)
          cargo run -q -p fid-outreach -- doc-run --guide "$guide" --repo .
          test "$before" = "$(git status --porcelain)"
      - name: Repository template code variant passes clippy (ECO.REPO.TPL.FILES AC-4)
        # +stable overrides the template's rust-toolchain.toml pin so no extra toolchain is installed.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="$RUNNER_TEMP/tpl-code"
          PYTHONPATH=tools python -m repo_template new --id fid-demo --variant code \
            --rules-source fixtures/repo/tpl/rules \
            --rules-rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --ci-rev bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb --year 2026 --out "$out"
          cd "$out"
          grep -q '^"starter" = ' layers.toml
          cargo +stable clippy --workspace --all-targets -- -D warnings
          cargo +stable test --workspace
  msrv:
    # rust-version = 1.81 (Cargo.toml). Cargo 1.81 ignores the [resolver] key in
    # .cargo/config.toml; MSRV-aware resolution happens in the stable and lockfile jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.81"
      - name: Check on MSRV 1.81
        run: cargo check --workspace --all-targets
  deny:
    # Licences, advisories, bans, sources (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check all
  wasm32:
    # CONSTITUTION §4: bit-identity on wasm32 (KRN.NUM.ERR AC-2, KRN.NUM.RNG AC-2).
    # Test binaries run under wasmtime; the workspace is mapped at its own absolute
    # path so fixture paths built from CARGO_MANIFEST_DIR resolve inside the guest.
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}::${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: "v49.0.6"
      - run: wasmtime --version
      - name: Test kernel and core crates on wasm32-wasip1
        run: cargo test --target wasm32-wasip1 -p fid-num -p fid-canon -p fid-kci -p fid-replay -p fid-surface -p fid-types
