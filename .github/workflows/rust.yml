name: rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Crate layering (ECO.REPO.LAYERS)
        run: cargo xtask layers
      - name: Dataset catalogue admission check via cargo xtask (ECO.DATA.CAT AC-1)
        run: cargo xtask datasets-check --catalogue fixtures/datasets/valid.toml --domains fixtures/datasets/domains.txt
      - name: Second implementation reproduces the canonical-JSON vectors (CORE.JRN.CANON AC-2)
        run: node fixtures/core/jrn/canon/runner.mjs
      - name: CLI smoke test
        shell: bash
        run: |
          out=$(echo '{"b":1,"a":[1e21,0.1]}' | cargo run -q -p fid-cli -- canon)
          test "$out" = '{"a":[1e+21,0.1],"b":1}'
          echo '{"b":1}' | cargo run -q -p fid-cli -- canon --json > ok.json
          cat ok.json
          grep -q '"outcome":"computed"' ok.json
          if echo '{"a":1,"a":2}' | cargo run -q -p fid-cli -- canon --json > bad.json; then exit 1; fi
          grep -q '"canon_error":"duplicate_key"' bad.json
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Envelopes validate against schema/envelope-v1.json (AUTO.SURF.ENV AC-1)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --quiet jsonschema
          python tools/check_envelopes.py ok.json bad.json
          python tools/check_command_defs.py
