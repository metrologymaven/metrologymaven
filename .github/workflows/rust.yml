name: rust
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push to the same PR or main cancels the older run; merge_group is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      mode: ${{ steps.scope.outputs.mode }}
      crates: ${{ steps.scope.outputs.crates }}
      affected_count: ${{ steps.scope.outputs.affected_count }}
      wasm_crates: ${{ steps.scope.outputs.wasm_crates }}
      run_wasm_kernel: ${{ steps.scope.outputs.run_wasm_kernel }}
      run_wasm32: ${{ steps.scope.outputs.run_wasm32 }}
      run_msrv: ${{ steps.scope.outputs.run_msrv }}
      run_deny: ${{ steps.scope.outputs.run_deny }}
      run_verify_guide: ${{ steps.scope.outputs.run_verify_guide }}
      run_tmpl_fuzz: ${{ steps.scope.outputs.run_tmpl_fuzz }}
      run_ooc_full: ${{ steps.scope.outputs.run_ooc_full }}
      run_batch_full: ${{ steps.scope.outputs.run_batch_full }}
      run_nurbs_oracle: ${{ steps.scope.outputs.run_nurbs_oracle }}
      run_dmis_conf: ${{ steps.scope.outputs.run_dmis_conf }}
      run_site_import: ${{ steps.scope.outputs.run_site_import }}
      run_contrib_guide: ${{ steps.scope.outputs.run_contrib_guide }}
      run_repo_tpl: ${{ steps.scope.outputs.run_repo_tpl }}
      run_fuzz_checks: ${{ steps.scope.outputs.run_fuzz_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: Compute fail-closed CI scope
        id: scope
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_scope.py --event "${{ github.event_name }}" --base "$CI_BASE_SHA" --head "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  test-ubuntu:
    name: test (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
          # KRN.NUM.LINT.TYPED lints the kernel crates for these targets (cargo clippy --target).
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-pc-windows-msvc
      - name: Cargo.lock up to date
        # Blocking: a PR that adds a crate or dependency must update Cargo.lock in the same PR.
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Working tree is the committed bytes (KRN.MAN.MANI.IMPL REQ-003)
        shell: bash
        run: |
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then echo "$dirty"; exit 1; fi
          bad=$(git ls-files --eol | awk -F'\t' '{
            split($1, f, " +"); i = substr(f[1], 3); w = substr(f[2], 3); path = $2
            if (i == w) next
            hashed = (path ~ /^(crates|vendor|\.cargo)\// || path == "Cargo.toml" || path == "Cargo.lock")
            if ($1 ~ /eol=crlf/ && !hashed) next
            print
          }')
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "rust-stable-linux"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: nextest
      - name: Fetch dependencies for all targets (ECO.REPO.ALLOW checks every platform offline)
        run: cargo fetch
      - name: Lint
        shell: bash
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "full" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            # $CRATES is intentionally word-split (`-p c1 -p c2 ...`).
            cargo clippy $CRATES --all-targets -- -D warnings
          fi
      - name: Test
        shell: bash
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "full" ]; then
            cargo nextest run --workspace --no-fail-fast --no-tests=pass
            cargo test --workspace --exclude fid-clarabel --doc
          else
            cargo nextest run $CRATES --no-fail-fast --no-tests=pass
            DOC_CRATES=$(echo " $CRATES " | sed 's/ -p fid-clarabel / /g')
            if [ -n "$(echo "$DOC_CRATES" | tr -d ' ')" ]; then
              cargo test $DOC_CRATES --doc
            fi
          fi
      - name: Frame graph adapter report (VIZ.RENDER.FRAME.GRAPH AC-1)
        if: needs.changes.outputs.mode == 'full' || contains(needs.changes.outputs.crates, 'fid-render')
        run: cargo test -p fid-render --test frame_graph -- --show-output
      - name: Template format fuzz, full 1 000 000 iterations in release (RPT.MODEL.TMPL.FORMAT AC-4)
        if: needs.changes.outputs.run_tmpl_fuzz == 'true'
        env:
          TMPL_FUZZ_FULL: "1"
        run: cargo test --release -p fid-report --test tmpl_format_fuzz -- --nocapture
      - name: Out-of-core layout on the full 5 000 000-point cloud in release (GEO.OOC.LAYOUT AC-1, AC-2)
        if: needs.changes.outputs.run_ooc_full == 'true'
        env:
          FID_OOC_FULL: "1"
        run: cargo test --release -p fid-geo-ooc --test cloud_5e6 -- --nocapture
      - name: Batch projection on the full 1 000 000-point scan in release (GEO.DIST.BATCH AC-1, AC-4)
        if: needs.changes.outputs.run_batch_full == 'true'
        env:
          FID_BATCH_POINTS: "1000000"
        run: cargo test --release -p fid-geo-dist --test batch -- --nocapture
      - name: Kernel WASM shim with its stand-in test algorithms, natively (KRN.MAN.WASM AC-2)
        if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.run_wasm_kernel == 'true'
        run: |
          cargo clippy -p fid-kernel-wasm --all-targets --features test-algorithms -- -D warnings
          cargo test -p fid-kernel-wasm --features test-algorithms
      - name: Site import verify runs with the network cut (OUTR.SITE.GEN.IMPORT AC-7)
        if: needs.changes.outputs.run_site_import == 'true'
        shell: bash
        run: |
          cargo build -q -p fid-outreach
          if sudo unshare --net -- curl -sS -m 10 -o /dev/null https://github.com; then exit 1; fi
          stage="$RUNNER_TEMP/site-import-stage"
          sudo unshare --net -- ./target/debug/fid-outreach site import verify --site fixtures/outr/site/import/ok --stage "$stage" --revision abc123 --revision-date 2026-11-17
          cmp "$stage/build-manifest.json" fixtures/outr/site/import/expected/build-manifest.json
      - name: DMIS conformance table is fresh (IO.DMIS.CONF AC-4)
        if: needs.changes.outputs.run_dmis_conf == 'true'
        shell: bash
        run: |
          cargo test --workspace --no-run --message-format=json > "$RUNNER_TEMP/cargo-tests.json"
          cargo run -q -p fid-io-dmis --bin dmis-conformance -- inventory \
            --cargo-json "$RUNNER_TEMP/cargo-tests.json" --out "$RUNNER_TEMP/test-inventory.txt"
          grep -qx 'fid-io-dmis::acceptance::ac3_same_inputs_give_identical_bytes: test' "$RUNNER_TEMP/test-inventory.txt"
          if grep -q 'ignored_inventory_probe' "$RUNNER_TEMP/test-inventory.txt"; then exit 1; fi
          cargo run -q -p fid-io-dmis --bin dmis-conformance -- \
            --decl crates/fid-io-dmis/conformance/declarations.toml \
            --tests "$RUNNER_TEMP/test-inventory.txt" --check docs/dmis
      - name: Crate layering (ECO.REPO.LAYERS)
        run: cargo xtask layers
      - name: Kernel-graph dependency allowlist (ECO.REPO.ALLOW)
        run: cargo xtask kernel-allow
      - name: Fuzz harnesses compile on stable
        if: needs.changes.outputs.run_fuzz_checks == 'true'
        run: |
          cargo check --manifest-path crates/fid-program/fuzz/Cargo.toml
          cargo check --manifest-path crates/fid-xml/fuzz/Cargo.toml
          cargo check --manifest-path crates/fid-cad-proto/fuzz/Cargo.toml
          cargo check --manifest-path crates/fid-io-las/fuzz/Cargo.toml
      - name: No side doors (CORE.BUS.LINT)
        run: cargo xtask lint-crate-graph
      - name: Release builds never enable the egress test hooks (CORE.BUS.POL.EGRESS)
        shell: bash
        run: |
          release=$(cargo tree --workspace --target all -e normal,build -i fid-bus -f '{p} {f}')
          echo "$release" | head -n 1
          echo "$release" | grep -q '^fid-bus ' || { echo "fid-bus is missing from the tree"; exit 1; }
          if echo "$release" | grep -q 'permit-test-hooks'; then
            echo "permit-test-hooks is enabled in a release build:"; echo "$release" | grep 'permit-test-hooks'; exit 1
          fi
          control=$(cargo tree --workspace --target all -e normal,build,dev -i fid-bus -f '{p} {f}')
          echo "$control" | grep -q 'permit-test-hooks' || { echo "control run does not see the feature"; exit 1; }
      - name: Release builds never enable the store's commit probe (CORE.STO.SQL.CRASH)
        shell: bash
        run: |
          release=$(cargo tree --workspace --target all -e normal,build -i fid-store -f '{p} {f}')
          echo "$release" | head -n 1
          echo "$release" | grep -q '^fid-store ' || { echo "fid-store is missing from the tree"; exit 1; }
          if echo "$release" | grep -q 'test-probe'; then
            echo "test-probe is enabled in a release build:"; echo "$release" | grep 'test-probe'; exit 1
          fi
          control=$(cargo tree --workspace --target all -e normal,build,dev -i fid-store -f '{p} {f}')
          echo "$control" | grep -q 'test-probe' || { echo "control run does not see the feature"; exit 1; }
      - name: Workspace xtask invariants
        if: needs.changes.outputs.mode == 'full' || contains(needs.changes.outputs.crates, 'fid-xtask') || contains(needs.changes.outputs.crates, 'fid-platform') || contains(needs.changes.outputs.crates, 'fid-data')
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask datasets-check --catalogue fixtures/datasets/valid.toml --domains fixtures/datasets/domains.txt
          out=$(cargo xtask plat-matrix validate fixtures/plat/matrix/valid.toml)
          test "$out" = "6 rows, 0 errors"
          cargo xtask plat-matrix validate platform/support-matrix.toml
          cargo xtask plat-matrix page --matrix fixtures/plat/matrix/valid.toml --out "$RUNNER_TEMP/page.md"
          cmp "$RUNNER_TEMP/page.md" fixtures/plat/matrix/expected-page.md
          cargo xtask plat-matrix page --check --out docs/platform/support-matrix.md
          out=$(cargo xtask plat-hw validate --file fixtures/plat/hw/profiles-valid.toml)
          test "$out" = "$(printf 'minimum\nrecommended')"
          for f in inverted no-minimum extra-field; do
            set +e; cargo xtask plat-hw validate --file fixtures/plat/hw/profiles-$f.toml; code=$?; set -e
            test "$code" = 1
          done
          cargo xtask plat-hw validate
          g=fixtures/plat/gpu
          m="--matrix fixtures/plat/matrix/valid.toml --phase P1a"
          cargo xtask plat-gpu validate --policy $g/policy-valid.toml $m --known-bad $g/known-bad-valid.toml
          set +e; out=$(cargo xtask plat-gpu validate --policy $g/policy-win-no-vulkan.toml $m); code=$?; set -e
          test "$code" = 1 && grep -q '^MissingMandatoryBackend { os: windows, backend: vulkan }' <<< "$out"
          set +e; out=$(cargo xtask plat-gpu validate --policy $g/policy-missing-row.toml $m); code=$?; set -e
          test "$code" = 1 && grep -qx 'NoPolicyRow { os: macos, arch: aarch64 }' <<< "$out"
          set +e; out=$(cargo xtask plat-gpu validate --policy $g/policy-no-software.toml $m); code=$?; set -e
          test "$code" = 1 && grep -q '^NoSoftwareFallback' <<< "$out"
          set +e; out=$(cargo xtask plat-gpu validate --known-bad $g/known-bad-noref.toml); code=$?; set -e
          test "$code" = 1 && grep -qx 'MissingReference { id: fixture-noref }' <<< "$out"
          cargo xtask plat-gpu validate
          d=fixtures/plat/deploy
          out=$(cargo xtask plat-deploy validate-layout $m)
          test "$out" = "layout: 3 os, 0 errors"
          set +e; out=$(cargo xtask plat-deploy validate-layout --file $d/layout-programfiles.toml $m); code=$?; set -e
          test "$code" = 1 && grep -qx 'OutsideProfile { os: windows, entry: install_dir }' <<< "$out"
          set +e; out=$(cargo xtask plat-deploy validate-layout --file $d/layout-missing-macos.toml $m); code=$?; set -e
          test "$code" = 1 && grep -qx 'MissingOs { os: macos }' <<< "$out"
          cargo xtask plat-deploy validate-layout
          out=$(cargo xtask plat-hw validate-suite --file fixtures/plat/bench/mini-suite.toml)
          test "$out" = "$(printf 'mini.load\nmini.render')"
          set +e; out=$(cargo xtask plat-hw validate-suite --file fixtures/plat/bench/suite-no-digest.toml); code=$?; set -e
          test "$code" = 1 && test "$out" = "MissingDigest { workload: no-digest.load }"
          set +e; out=$(cargo xtask plat-hw validate-suite --file fixtures/plat/bench/suite-bad-unit.toml); code=$?; set -e
          test "$code" = 1 && grep -q '^BadUnit { workload: bad-unit.load' <<< "$out"
          net="plat-deploy netlist --manifest $d/manifest-net.json"
          out=$(cargo xtask $net --settings $d/settings-manifest.json \
            --json $d/network-features.json --md $d/network-features.md --check)
          test "$out" = "netlist: 3 commands, up to date"
          set +e
          out=$(cargo xtask $net --settings $d/settings-consent-on.json \
            --json "$RUNNER_TEMP/nf.json" --md "$RUNNER_TEMP/nf.md")
          code=$?
          set -e
          test "$code" = 1 && test "$out" = 'X1DefaultOn { command: "update.check@1" }'
          cargo xtask rel keys-check
          cargo xtask rel keys-check --keys fixtures/rel/guide/keys --doc fixtures/rel/guide/docs/KEYS.md
          v=fixtures/solv/vend
          out=$(cargo xtask conic-audit --dir $v/ok)
          test "$out" = "conic-audit: ok"
          set +e; out=$(cargo xtask conic-audit --dir $v/drift); code=$?; set -e
          test "$code" = 1 && grep -q '^AUDIT-PATCH-DRIFT crate/src/lib.rs: ' <<< "$out"
          set +e; out=$(cargo xtask conic-audit --dir $v/digest); code=$?; set -e
          test "$code" = 1 && grep -q '^AUDIT-DIGEST upstream/: ' <<< "$out"
          set +e; out=$(cargo xtask conic-audit --dir $v/update --previous $v/ok/AUDIT.toml); code=$?; set -e
          test "$code" = 1 && grep -q '^AUDIT-PATCH-MISSING 0002: ' <<< "$out"
          cargo xtask conic-audit --dir $v/update --audit $v/update/AUDIT-dropped.toml --previous $v/ok/AUDIT.toml
          set +e
          out=$(cargo xtask conic-audit --dir $v/ok --report $v/lint/unwaived-pow.json --audit $v/lint/AUDIT-unwaived-pow.toml)
          code=$?
          set -e
          test "$code" = 1 && test "$out" = 'AUDIT-LINT crate/src/x.rs:6:14: unwaived KNP1-POW finding'
          if [ -L vendor ]; then echo "::error::vendor/ is a symbolic link"; exit 1; fi
          if [ -e vendor ]; then
            if [ ! -d vendor ]; then echo "::error::vendor is not a directory"; exit 1; fi
            shopt -s nullglob dotglob
            for e in vendor/*; do
              if [ -L "$e" ] || [ "$e" != vendor/fid-clarabel ] || [ ! -d "$e" ]; then
                echo "::error::$e is not an audited vendored directory"; exit 1
              fi
            done
            if [ -d vendor/fid-clarabel ]; then
              CARGO_TARGET_DIR=target/lint-driver cargo run --manifest-path vendor/fid-clarabel/lint-driver/Cargo.toml -- --check
              cargo xtask conic-audit
            fi
          fi
          cargo xtask plat-matrix lint-tiers
          cargo xtask study-tasks-check
      - name: Second implementations (Node)
        if: needs.changes.outputs.mode == 'full' || contains(needs.changes.outputs.crates, 'fid-canon') || contains(needs.changes.outputs.crates, 'fid-registry')
        run: |
          node fixtures/core/jrn/canon/runner.mjs
          node fixtures/core/reg/manifest/check_digests.mjs
      - name: CLI smoke test
        shell: bash
        run: |
          out=$(echo '{"b":1,"a":[1e21,0.1]}' | cargo run -q -p fid-cli -- canon)
          test "$out" = '{"a":[1e+21,0.1],"b":1}'
          echo '{"b":1}' | cargo run -q -p fid-cli -- canon --json > ok.json
          cat ok.json
          grep -q '"outcome":"computed"' ok.json
          if echo '{"a":1,"a":2}' | cargo run -q -p fid-cli -- canon --json > bad.json; then exit 1; fi
          grep -q '"canon_error":"duplicate_key"' bad.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Envelopes validate against schema/envelope-v1.json (AUTO.SURF.ENV AC-1), then parallel fixture checks
        # New Python fixture checks: add one line to ci/fixture-checks.txt (sorted), not a line here.
        shell: bash
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.crates }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python -m pip install --quiet jsonschema
          python tools/check_envelopes.py ok.json bad.json
          list=ci/fixture-checks.txt
          python tools/run_fixture_checks.py --list "$list" --mode "$MODE" --base "$CI_BASE_SHA" --head "${{ github.sha }}" --crates "$CRATES"
      - name: NURBS reference oracle regenerates byte-identically (GEO.NURBS.REF AC-1)
        if: needs.changes.outputs.run_nurbs_oracle == 'true'
        run: python tools/fixtures/nurbs_oracle.py --out fixtures/geo/nurbs --seed 40 --check
      - name: Contributor guide passes claim lint and its commands run (OUTR.DOCS.CONTRIB AC-6, AC-1, AC-3)
        if: needs.changes.outputs.run_contrib_guide == 'true'
        shell: bash
        run: |
          cargo run -q -p fid-brand-lint -- claim-lint --rules crates/fid-brand-lint/rules/claim-rules.toml docs/contributor/guide.md
          guide="$RUNNER_TEMP/contributor-guide.md"
          sed "s/^revision: .*/revision: $(git rev-parse HEAD)/" docs/contributor/guide.md > "$guide"
          before=$(git status --porcelain)
          cargo run -q -p fid-outreach -- doc-run --guide "$guide" --repo .
          test "$before" = "$(git status --porcelain)"
      - name: Repository template code variant passes clippy (ECO.REPO.TPL.FILES AC-4)
        if: needs.changes.outputs.run_repo_tpl == 'true'
        shell: bash
        run: |
          out="$RUNNER_TEMP/tpl-code"
          PYTHONPATH=tools python -m repo_template new --id fid-demo --variant code \
            --rules-source fixtures/repo/tpl/rules \
            --rules-rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --ci-rev bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb --year 2026 --out "$out"
          cd "$out"
          grep -q '^"starter" = ' layers.toml
          cargo +stable clippy --workspace --all-targets -- -D warnings
          cargo +stable test --workspace

  test-windows:
    name: test (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-pc-windows-msvc
      - name: Working tree is the committed bytes (KRN.MAN.MANI.IMPL REQ-003)
        shell: bash
        run: |
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then echo "$dirty"; exit 1; fi
          bad=$(git ls-files --eol | awk -F'\t' '{
            split($1, f, " +"); i = substr(f[1], 3); w = substr(f[2], 3); path = $2
            if (i == w) next
            hashed = (path ~ /^(crates|vendor|\.cargo)\// || path == "Cargo.toml" || path == "Cargo.lock")
            if ($1 ~ /eol=crlf/ && !hashed) next
            print
          }')
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "rust-stable-windows"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: nextest
      - name: Fetch dependencies for all targets
        run: cargo fetch
      - name: Lint
        shell: bash
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "full" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            cargo clippy $CRATES --all-targets -- -D warnings
          fi
      - name: Test
        shell: bash
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "full" ]; then
            cargo nextest run --workspace --no-fail-fast --no-tests=pass
            cargo test --workspace --exclude fid-clarabel --doc
          else
            cargo nextest run $CRATES --no-fail-fast --no-tests=pass
            DOC_CRATES=$(echo " $CRATES " | sed 's/ -p fid-clarabel / /g')
            if [ -n "$(echo "$DOC_CRATES" | tr -d ' ')" ]; then
              cargo test $DOC_CRATES --doc
            fi
          fi
      - name: Frame graph adapter report (VIZ.RENDER.FRAME.GRAPH AC-1)
        if: needs.changes.outputs.mode == 'full' || contains(needs.changes.outputs.crates, 'fid-render')
        run: cargo test -p fid-render --test frame_graph -- --show-output
      - name: Kernel WASM shim natively (KRN.MAN.WASM AC-2)
        if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.run_wasm_kernel == 'true'
        run: |
          cargo clippy -p fid-kernel-wasm --all-targets --features test-algorithms -- -D warnings
          cargo test -p fid-kernel-wasm --features test-algorithms
      - name: Cross-OS smoke checks (full runs)
        if: needs.changes.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask fmt --check
          cargo xtask layers
          cargo xtask kernel-allow
          cargo xtask lint-crate-graph
          node fixtures/core/jrn/canon/runner.mjs
          node fixtures/core/reg/manifest/check_digests.mjs
          out=$(echo '{"b":1,"a":[1e21,0.1]}' | cargo run -q -p fid-cli -- canon)
          test "$out" = '{"a":[1e+21,0.1],"b":1}'

  test-macos:
    name: test (macos-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-pc-windows-msvc
      - name: Working tree is the committed bytes (KRN.MAN.MANI.IMPL REQ-003)
        shell: bash
        run: |
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then echo "$dirty"; exit 1; fi
          bad=$(git ls-files --eol | awk -F'\t' '{
            split($1, f, " +"); i = substr(f[1], 3); w = substr(f[2], 3); path = $2
            if (i == w) next
            hashed = (path ~ /^(crates|vendor|\.cargo)\// || path == "Cargo.toml" || path == "Cargo.lock")
            if ($1 ~ /eol=crlf/ && !hashed) next
            print
          }')
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "rust-stable-macos"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: nextest
      - name: Fetch dependencies for all targets
        run: cargo fetch
      - name: Lint
        shell: bash
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "full" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            cargo clippy $CRATES --all-targets -- -D warnings
          fi
      - name: Test
        shell: bash
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "full" ]; then
            cargo nextest run --workspace --no-fail-fast --no-tests=pass
            cargo test --workspace --exclude fid-clarabel --doc
          else
            cargo nextest run $CRATES --no-fail-fast --no-tests=pass
            DOC_CRATES=$(echo " $CRATES " | sed 's/ -p fid-clarabel / /g')
            if [ -n "$(echo "$DOC_CRATES" | tr -d ' ')" ]; then
              cargo test $DOC_CRATES --doc
            fi
          fi
      - name: Frame graph adapter report (VIZ.RENDER.FRAME.GRAPH AC-1)
        if: needs.changes.outputs.mode == 'full' || contains(needs.changes.outputs.crates, 'fid-render')
        run: cargo test -p fid-render --test frame_graph -- --show-output
      - name: Kernel WASM shim natively (KRN.MAN.WASM AC-2)
        if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.run_wasm_kernel == 'true'
        run: |
          cargo clippy -p fid-kernel-wasm --all-targets --features test-algorithms -- -D warnings
          cargo test -p fid-kernel-wasm --features test-algorithms
      - name: Cross-OS smoke checks (full runs)
        if: needs.changes.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask layers
          cargo xtask kernel-allow
          cargo xtask lint-crate-graph
          node fixtures/core/jrn/canon/runner.mjs
          node fixtures/core/reg/manifest/check_digests.mjs
          out=$(echo '{"b":1,"a":[1e21,0.1]}' | cargo run -q -p fid-cli -- canon)
          test "$out" = '{"a":[1e+21,0.1],"b":1}'

  verify-guide:
    needs: changes
    if: needs.changes.outputs.run_verify_guide == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: verify-linux
          - os: windows-latest
            tag: verify-windows
          - os: macos-latest
            tag: verify-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Follow VERIFY.md (${{ matrix.tag }})
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              offline() { sudo unshare --net -- "$@"; }
              py=python3 ;;
            macOS)
              offline() { sandbox-exec -p '(version 1)(allow default)(deny network*)' "$@"; }
              py=python3 ;;
            *)
              offline() { "$@"; }
              py=python ;;
          esac
          if [ "$RUNNER_OS" != Windows ]; then
            if offline curl -sS -m 10 -o /dev/null https://github.com; then exit 1; fi
          fi
          offline "$py" tools/verify_guide.py --tag "${{ matrix.tag }}"

  fuzz-pkg-reader:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to run
        id: scope
        shell: bash
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if ! git diff --name-only "$base"...HEAD | grep -qE '^(crates/fid-pkg/|fixtures/pkg/)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        if: steps.scope.outputs.run == 'true'
        run: cargo install cargo-fuzz --locked
      - name: Fuzz the package reader for 10 minutes
        if: steps.scope.outputs.run == 'true'
        working-directory: crates/fid-pkg/fuzz
        run: |
          mkdir -p corpus/reader
          seeds="../../../fixtures/pkg/malformed ../../../fixtures/pkg/reader/valid ../../../fixtures/pkg/golden"
          cargo fuzz run --sanitizer none reader corpus/reader $seeds -- -max_total_time=600 -timeout=5 -rss_limit_mb=256

  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.run_msrv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "rust-msrv-1.89"
      - name: Check on MSRV 1.89
        shell: bash
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "full" ]; then
            cargo check --workspace --all-targets
          else
            cargo check $CRATES --all-targets
          fi

  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.run_deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check all

  wasm32:
    name: wasm32
    needs: changes
    if: needs.changes.outputs.run_wasm32 == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}::${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "rust-wasm32"
      - name: Cache pinned wasmtime v49.0.6
        id: cache-wasmtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/fid-wasmtime/wasmtime-v49.0.6-x86_64-linux
          key: wasmtime-v49.0.6-x86_64-linux-15625b129e545347
      - name: Install wasmtime v49.0.6 (tarball SHA-256 pinned and verified before use)
        shell: bash
        env:
          WASMTIME_TARBALL: wasmtime-v49.0.6-x86_64-linux.tar.xz
          WASMTIME_SHA256: 15625b129e54534793dc77965d6912a5307db8e8e90ee114f52ef62ce6e4f918
          WASMTIME_DIR: ~/.cache/fid-wasmtime/wasmtime-v49.0.6-x86_64-linux
        run: |
          set -euo pipefail
          dest="$HOME/.cache/fid-wasmtime/wasmtime-v49.0.6-x86_64-linux"
          if [ ! -x "$dest/wasmtime" ]; then
            d="$RUNNER_TEMP/wasmtime"
            mkdir -p "$d" "$HOME/.cache/fid-wasmtime"
            curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o "$d/$WASMTIME_TARBALL" \
              "https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.6/$WASMTIME_TARBALL"
            echo "$WASMTIME_SHA256  $d/$WASMTIME_TARBALL" | sha256sum --check --strict -
            tar -xJf "$d/$WASMTIME_TARBALL" -C "$HOME/.cache/fid-wasmtime"
          fi
          echo "$dest" >> "$GITHUB_PATH"
      - run: wasmtime --version
      - name: Crates tested on wasm32-wasip1 (batched from ci/wasm32-crates.txt)
        shell: bash
        env:
          ONLY: ${{ needs.changes.outputs.wasm_crates }}
        run: python3 tools/run_wasm32_tests.py --list ci/wasm32-crates.txt --only "$ONLY"
      - name: Kernel WASM reference module, import allowlist and golden calls (KRN.MAN.WASM AC-1 to AC-3)
        if: needs.changes.outputs.run_wasm_kernel == 'true'
        shell: bash
        run: |
          set -euo pipefail
          c=crates/fid-kernel-wasm
          w=fixtures/man/wasm
          cargo build -q --release --target wasm32-wasip1 -p fid-kernel-wasm
          cargo build -q --release --target wasm32-wasip1 -p fid-kernel-wasm --features test-algorithms --target-dir target/wasm-test
          cargo build -q -p fid-wasm-check
          chk=target/debug/fid-wasm-check
          wasmtime run -W help | grep -E 'nan-canonicalization|relaxed-simd|threads|max-wasm-stack|max-memory-size|trap-on-grow-failure|fuel|unknown-imports-trap' || true
          ref="$RUNNER_TEMP/fid-kernel-wasm.wasm"
          tst="$RUNNER_TEMP/fid-kernel-wasm-test.wasm"
          $chk seal target/wasm32-wasip1/release/fid-kernel-wasm.wasm "$ref"
          $chk seal target/wasm-test/wasm32-wasip1/release/fid-kernel-wasm.wasm "$tst"
          sha256sum "$ref" "$tst"
          if grep -q 'test.stack.recurse' "$ref"; then echo "::error::stand-ins in the reference module"; exit 1; fi
          grep -q 'test.stack.recurse' "$tst"
          $chk runtime-digest $c/wasm-runtime.toml > "$RUNNER_TEMP/runtime-digest.txt"
          cmp "$RUNNER_TEMP/runtime-digest.txt" $w/runtime-digest.txt
          $chk imports "$ref" $c/wasm-imports.allow
          $chk imports "$tst" $c/wasm-imports.allow
          set +e; $chk imports target/wasm32-wasip1/release/fid-kernel-wasm.wasm $c/wasm-imports.allow; code=$?; set -e
          test "$code" = 1
          set +e; out=$($chk imports $w/modules/bad-random-get.wasm $c/wasm-imports.allow); code=$?; set -e
          echo "$out"
          test "$code" = 1 && grep -qx 'DENIED wasi_snapshot_preview1 random_get (func)' <<< "$out"
          $chk golden $c/wasm-runtime.toml $c/wasm-imports.allow "$tst" $w/calls-v1.txt
          call='{"algorithm":"test.echo.identity@1.0.0","inputs":[],"params":""}'
          set +e; out=$(printf '%s' "$call" | $chk run $c/wasm-runtime.toml $c/wasm-imports.allow "$ref"); code=$?; set -e
          test "$code" = 1 && test "$out" = '{"error":"unknown_algorithm"}'
          $chk seal $w/modules/clock-call.wasm "$RUNNER_TEMP/clock.wasm"
          cmp "$RUNNER_TEMP/clock.wasm" $w/modules/clock-call.sealed.wasm
          set +e; out=$(printf '' | $chk run $c/wasm-runtime.toml $c/wasm-imports.allow "$RUNNER_TEMP/clock.wasm"); code=$?; set -e
          test "$code" = 4 && test "$out" = 'NOT_REPLAYABLE(trap)'
          set +e; printf '' | $chk run $c/wasm-runtime.toml $c/wasm-imports.allow $w/modules/clock-call.wasm; code=$?; set -e
          test "$code" = 5
          set +e; out=$(printf '' | $chk run $c/wasm-runtime.toml $c/wasm-imports.allow $w/modules/loop.wasm); code=$?; set -e
          test "$code" = 3 && test "$out" = 'NOT_REPLAYABLE(resource)'
      - name: Kernel manifest, two stages twice and self-reports (KRN.MAN.MANI.GEN AC-1 to AC-4)
        if: needs.changes.outputs.run_wasm_kernel == 'true'
        shell: bash
        run: bash scripts/manifest-gen-ci.sh
