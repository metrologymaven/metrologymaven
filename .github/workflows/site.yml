name: site
# Builds metrologymaven.io from the spec tree on every PR; deploys on main (D-039).
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - name: Build Field Guide WASM kernel (OUTR.DOCS.GUIDE.WASM)
        run: |
          cargo build --locked -q -p fid-guide-wasm
          cargo build --locked --release --target wasm32-wasip1 -p fid-guide-wasm
      - name: Build static site
        run: python site/build.py
      - name: Verify Field Guide map, topics, CSP and WASM bit-identity
        run: python -m unittest discover -s tools/tests -p "test_guide.py" -v
      - name: No third-party origins in built pages (REQ-OUTR.SITE-007)
        run: |
          if grep -rEo '(src|href)="https?://[^"]+' site/dist --include=*.html --include=*.css \
               | grep -vE '="https://(metrologymaven\.io|github\.com/metrologymaven)' \
               | grep -E '(src)=|stylesheet' ; then
            echo "Built pages load third-party resources"; exit 1; fi
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4a32f08b7717354bc88faae8f95f425c
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set; skipping deploy."; exit 0; fi
          npx --yes wrangler@4 deploy
