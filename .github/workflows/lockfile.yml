name: lockfile
# Regenerates Cargo.lock (ECO.REL.REPRO.PIN). Run manually on a branch:
#   gh workflow run lockfile.yml --ref <branch>
# then download the "Cargo.lock" artifact and commit it.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Generate Cargo.lock (MSRV-aware via .cargo/config.toml)
        run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
          if-no-files-found: error
