name: kernel-repro
# KRN.MAN.REPRO: two independent builds of the same kernel source and lockfile give
# byte-identical WASM artifacts (REQ-KRN.MAN-009). The kernel artifact is built with
# scripts/rebuild-kernel.sh (the procedure a third party follows) three times: on a Linux x86-64
# runner as a separate user, on a macOS ARM64 runner as the runner user, and in a clean
# container that holds only the pinned toolchain; each in its own path. Each build also checks
# its settings and real toolchain and writes the toolchain-and-flags digest (fails closed on
# drift). The compare job fails unless every artifact SHA-256 and every digest matches, names
# the differing sections otherwise, and runs the golden calls on the artifact. A build with an
# injected build time must fail the comparison and name its section (AC-3).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels the older run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # rust:1.89.0-bookworm (multi-arch index), pinned by digest: the clean container of AC-2.
  # Its toolchain must match kernel-build/rust-toolchain.toml; the script checks that.
  REPRO_IMAGE: rust:1.89.0-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
  # Files every build uploads for the compare job.
  REPRO_FILES: fid-kernel-wasm.wasm fid-kernel-wasm.link.wasm rustc-vV.txt build-settings.json toolchain-digest.txt vendor-digest.txt build-info.txt SHA256SUMS
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned channel
        id: pin
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\([0-9.]*\)"$/\1/p' kernel-build/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: wasm32-wasip1
      - name: Rebuild as another user, in another path, with only the pinned toolchain (AC-1)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          channel='${{ steps.pin.outputs.channel }}'
          sde=$(git log -1 --format=%ct)
          tc=$(dirname "$(dirname "$(rustup which --toolchain "$channel" rustc)")")
          sudo cp -a "$tc" /opt/kernel-rust
          sudo chmod -R a+rX /opt/kernel-rust
          sudo useradd --create-home kbuild
          d=/srv/kbuild-linux
          sudo mkdir -p "$d/src"
          git archive HEAD | sudo tar -x -C "$d/src"
          sudo chown -R kbuild "$d"
          run() {
            sudo -u kbuild env -i HOME=/home/kbuild PATH=/opt/kernel-rust/bin:/usr/bin:/bin \
              SOURCE_DATE_EPOCH="$sde" bash "$d/src/scripts/rebuild-kernel.sh" "$@"
          }
          run --out "$d/out"
          # AC-3: the same build with the build time injected, from the vendored sources of the
          # first build, checked against the tree digest that build wrote (fully offline).
          run --out "$d/out-injected" --vendor "$d/out/work/vendor" \
            --vendor-digest "$(cat "$d/out/vendor-digest.txt")" --inject-timestamp-for-test
          mkdir -p "$RUNNER_TEMP/up/kernel" "$RUNNER_TEMP/up/injected"
          for f in $REPRO_FILES; do cp "$d/out/$f" "$RUNNER_TEMP/up/kernel/"; done
          cp "$d"/out-injected/{fid-kernel-wasm.wasm,SHA256SUMS} "$RUNNER_TEMP/up/injected/"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-linux
          path: ${{ runner.temp }}/up/kernel/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-linux-injected
          path: ${{ runner.temp }}/up/injected/
          if-no-files-found: error
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned channel
        id: pin
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\([0-9.]*\)"$/\1/p' kernel-build/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: wasm32-wasip1
      - name: Rebuild in another path through rustup and the toolchain file (AC-1)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sde=$(git log -1 --format=%ct)
          # Outside the home directory, so no Cargo config of the runner lies above the checkout.
          d=/tmp/kbuild-macos/checkout
          mkdir -p "$d/src"
          git archive HEAD | tar -x -C "$d/src"
          # Only the directory of the rustup proxies, so the toolchain file in kernel-build/ decides.
          proxies=$(dirname "$(command -v rustup)")
          env -i HOME="$HOME" PATH="$proxies:/usr/bin:/bin" ${RUSTUP_HOME:+RUSTUP_HOME="$RUSTUP_HOME"} \
            SOURCE_DATE_EPOCH="$sde" bash "$d/src/scripts/rebuild-kernel.sh" --out "$d/out"
          mkdir -p "$RUNNER_TEMP/up"
          for f in $REPRO_FILES; do cp "$d/out/$f" "$RUNNER_TEMP/up/"; done
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-macos
          path: ${{ runner.temp }}/up/
          if-no-files-found: error
  build-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild in a clean container with only the pinned toolchain, source mounted read-only (AC-2)
        shell: bash
        run: |
          set -euo pipefail
          sde=$(git log -1 --format=%ct)
          d="$RUNNER_TEMP/kbuild-container"
          mkdir -p "$d/src" "$d/out"
          git archive HEAD | tar -x -C "$d/src"
          docker run --rm -e SOURCE_DATE_EPOCH="$sde" -v "$d/src:/opt/kernel-source:ro" -v "$d/out:/out" \
            "$REPRO_IMAGE" bash -c \
            'set -e; rustup target add wasm32-wasip1; bash /opt/kernel-source/scripts/rebuild-kernel.sh --out /out/result'
          mkdir -p "$RUNNER_TEMP/up"
          for f in $REPRO_FILES; do cp "$d/out/result/$f" "$RUNNER_TEMP/up/"; done
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-container
          path: ${{ runner.temp }}/up/
          if-no-files-found: error
  compare:
    needs: [build-linux, build-macos, build-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install wasmtime v49.0.6 (tarball SHA-256 pinned and verified before use)
        # Same pinned release and digest as the wasm32 job of rust.yml (KRN.MAN.WASM wasm-runtime.toml).
        shell: bash
        env:
          WASMTIME_TARBALL: wasmtime-v49.0.6-x86_64-linux.tar.xz
          WASMTIME_SHA256: 15625b129e54534793dc77965d6912a5307db8e8e90ee114f52ef62ce6e4f918
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/wasmtime"
          mkdir -p "$d"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o "$d/$WASMTIME_TARBALL" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.6/$WASMTIME_TARBALL"
          echo "$WASMTIME_SHA256  $d/$WASMTIME_TARBALL" | sha256sum --check --strict -
          tar -xJf "$d/$WASMTIME_TARBALL" -C "$d"
          echo "$d/wasmtime-v49.0.6-x86_64-linux" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Every build gave the same artifact, toolchain and digests (AC-1, AC-2, REQ-KRN.MAN.REPRO-004)
        shell: bash
        run: |
          set -euo pipefail
          cargo build -q --locked -p fid-wasm-check
          chk=target/debug/fid-wasm-check
          L=art/kernel-linux
          head -n 100 $L/SHA256SUMS art/kernel-macos/SHA256SUMS art/kernel-container/SHA256SUMS
          head -n 100 $L/toolchain-digest.txt art/kernel-macos/toolchain-digest.txt art/kernel-container/toolchain-digest.txt
          fail=0
          for x in art/kernel-macos art/kernel-container; do
            for f in fid-kernel-wasm.wasm fid-kernel-wasm.link.wasm; do
              echo "::group::$f: $L vs $x"
              if ! $chk sections-diff "$L/$f" "$x/$f"; then echo "::error::$f differs: $L vs $x"; fail=1; fi
              echo "::endgroup::"
            done
            if ! diff <(grep -v '^host: ' $L/rustc-vV.txt) <(grep -v '^host: ' $x/rustc-vV.txt); then
              echo "::error::toolchain differs: $L vs $x"; fail=1
            fi
            for f in toolchain-digest.txt build-settings.json vendor-digest.txt; do
              if ! cmp $L/$f $x/$f; then echo "::error::$f differs: $L vs $x"; fail=1; fi
            done
          done
          test "$fail" = 0
          echo "kernel artifact $(cut -d' ' -f1 $L/SHA256SUMS | head -n 1), toolchain-and-flags digest $(cat $L/toolchain-digest.txt)"
      - name: The reproducible artifact passes the import allowlist, the SIMD check and its golden calls
        # The shipped (reference) module registers no algorithm, so its golden calls are the
        # algorithm-independent KRN.MAN.WASM calls (fixtures/man/repro/calls-reference-v1.txt),
        # run through the pinned wasmtime and runtime settings.
        shell: bash
        run: |
          set -euo pipefail
          chk=target/debug/fid-wasm-check
          a=art/kernel-linux/fid-kernel-wasm.wasm
          c=crates/fid-kernel-wasm
          $chk imports $a $c/wasm-imports.allow
          $chk no-simd $a
          $chk golden $c/wasm-runtime.toml $c/wasm-imports.allow $a fixtures/man/repro/calls-reference-v1.txt
      - name: An injected build time fails the comparison and names its section (AC-3)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          out=$(target/debug/fid-wasm-check sections-diff art/kernel-linux/fid-kernel-wasm.wasm \
            art/kernel-linux-injected/fid-kernel-wasm.wasm)
          code=$?
          set -e
          echo "$out"
          test "$code" = 1
          grep -qx 'differing sections: custom:build_id' <<< "$out"
