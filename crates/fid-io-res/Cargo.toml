[package]
name = "fid-io-res"
description = "Metrology Maven result exchange: versioned CSV column maps and table dialect (IO.RES.CSV.MAP); result table export (IO.RES.CSV.OUT); transcription record model (IO.RES.TRANS.MODEL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# RFC 8785 canonical JSON parser and writer plus SHA-256 (CORE.JRN.CANON): the map digest.
fid-canon = { path = "../fid-canon" }
# Reader harness (IO.REG.LIMITS): 1 MiB bounded read of user maps, IoError, UntrustedText.
fid-io-reg = { path = "../fid-io-reg" }
# Shared `sha256:` digest type (AGENTS.md rule 14).
fid-types = { path = "../fid-types" }
# Replay outcome classes (CORE.RPL.CLASS) for replaying an export event (IO.RES.CSV.OUT AC-6).
fid-replay = { path = "../fid-replay" }
# Entity ID service (CORE.PRJ.CONT.ID): UUIDv5 IDs of transcription records and results.
fid-project = { path = "../fid-project" }
# Uncertainty statement (UNC.UEC.STMT, layer kernel): the UEC-0 statement every transcribed
# result carries, built and written by fid-kunc itself.
fid-kunc = { path = "../fid-kunc" }

[lints]
workspace = true
