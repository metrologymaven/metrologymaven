[package]
name = "fid-solv"
description = "Metrology Maven kernel optimisation drivers (KNP-1): deterministic seeded multi-start, nonlinear least squares and the conic (LP, QP, SOCP) wrapper and active-set extraction (spec nodes KRN.SOLV.MSTART, KRN.SOLV.NLLS, KRN.SOLV.CONIC.WRAP, KRN.SOLV.CERT.AS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Kernel crate (KNP-1): no third-party dependencies; only fid-num (layer num) and the
# vendored, KNP-1 patched conic solver fid-clarabel (layer kernel, KRN.SOLV.CONIC.PATCH),
# which the conic module wraps (KRN.SOLV.CONIC.WRAP).
[dependencies]
fid-clarabel = { path = "../../vendor/fid-clarabel/crate" }
fid-num = { path = "../fid-num" }

# Test-only: SHA-256 for golden digests (layer test-support).
[dev-dependencies]
fid-testkit = { path = "../fid-testkit" }

[lints]
workspace = true
