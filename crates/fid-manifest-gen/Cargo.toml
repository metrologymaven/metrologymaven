[package]
name = "fid-manifest-gen"
description = "Metrology Maven build-time kernel manifest generator: per-algorithm implementation digests over the crate closure (spec node KRN.MAN.MANI.IMPL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Build-time tool (layer `tool`): never linked into the kernel artifact; it may read files.
# Only first-party crates, so no new third-party crate enters the graph.
[dependencies]
# Bounded, duplicate-key-rejecting JSON reader for the `cargo metadata` file (model layer).
fid-canon = { path = "../fid-canon" }
# The kernel's SHA-256, canonical JSON writer, AlgorithmId and strict manifest reader
# (KRN.MAN.KCI, KRN.MAN.MANI.SCHEMA), reused so digests are computed by the kernel's own code.
fid-kci = { path = "../fid-kci" }

[lints]
workspace = true
