# Generated cargo-fuzz harness for registered first-party readers (IO.CORP.FUZZ).
# Not a workspace member: requires nightly + libFuzzer. Run from crates/fid-io-corp:
#   cargo +nightly fuzz run <target> <seeds_dir> -- -max_total_time=600 -timeout=10 -rss_limit_mb=2048
[package]
name = "fid-io-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fid-io-corp = { path = ".." }

[[bin]]
name = "mesh_ply"
path = "fuzz_targets/mesh_ply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mesh_stl"
path = "fuzz_targets/mesh_stl.rs"
test = false
doc = false
bench = false

# Keep this crate out of the parent workspace.
[workspace]
members = ["."]
