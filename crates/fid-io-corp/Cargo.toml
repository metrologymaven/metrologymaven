[package]
name = "fid-io-corp"
description = "Metrology Maven format corpora: manifests, licence checks and fetching and the hostile corpus generator (spec nodes IO.CORP.MANIF, IO.CORP.HOSTILE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "corpus-check"
path = "src/bin/corpus-check.rs"

[[bin]]
name = "corpus-hostile"
path = "src/bin/corpus-hostile.rs"

[dependencies]
fid-types = { path = "../fid-types" }
# Counter-based Philox RNG (KRN.NUM.RNG) for seeded bit flips (IO.CORP.HOSTILE); zero dependencies.
fid-num = { path = "../fid-num" }
# Reads the registry listing (`import.list_formats@1` JSON) with the project's bounded JSON parser.
fid-canon = { path = "../fid-canon" }
# Reads corpus manifests as an untyped table (no serde derive), as fid-knp1-lint does.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Streaming SHA-256 of corpus files and fetched bytes; already in the graph through fid-canon.
sha2 = "0.10"

[dev-dependencies]
# Test-only: the merged readers check the hand-labelled expected errors of their variants
# (E57 physical layer and the hardened XML reader, with the IO.REG.LIMITS budget it takes).
fid-io-e57 = { path = "../fid-io-e57" }
fid-xml = { path = "../fid-xml" }
fid-io-reg = { path = "../fid-io-reg" }

[lints]
workspace = true
