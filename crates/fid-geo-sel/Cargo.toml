[package]
name = "fid-geo-sel"
description = "Metrology Maven selection model, algebra and CPU pick/lasso resolution: index sets, canonical digests, stale checks, range set operations, mesh/point grow or shrink, and deterministic CPU lasso/pick resolution (spec nodes GEO.SEL.MODEL, GEO.SEL.ALGEBRA, GEO.SEL.RESOLVE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Kernel crate (KNP-1): no third-party dependencies. Only workspace crates of the num and
# kernel layers: fid-geo-frame (Rigid view transforms for GEO.SEL.RESOLVE), fid-geo-types
# (elements, ElementDigest and the GEO.TYPES.DIGEST element digest), fid-geo-index
# (PointIndex::radius for GEO.SEL.ALGEBRA and PrimitiveBvh::ray for GEO.SEL.RESOLVE),
# fid-kci (its portable FIPS 180-4 SHA-256), fid-num (KNP-1 transcendentals and total
# order) and fid-types (the shared `sha256:` Digest wire form).
[dependencies]
fid-geo-frame = { path = "../fid-geo-frame" }
fid-geo-index = { path = "../fid-geo-index" }
fid-geo-types = { path = "../fid-geo-types" }
fid-kci = { path = "../fid-kci" }
fid-num = { path = "../fid-num" }
fid-types = { path = "../fid-types" }

[lints]
workspace = true
