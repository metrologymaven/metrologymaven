[package]
name = "fid-bus"
description = "Metrology Maven command bus: closed error code set, principal model, handler contract, class policy, file handles, MCP projection with pending requests, authored literal normalisation, the egress primitive, command resolution, parameter validation and preconditions, and the pipeline with its all-or-nothing commit (spec nodes CORE.BUS.PIPE.ERR, CORE.BUS.PRIN, CORE.BUS.PIPE.HANDLER, CORE.BUS.POL.CLASS, CORE.BUS.POL.FS, CORE.BUS.POL.PROJ, CORE.BUS.UNIT, CORE.BUS.POL.EGRESS, CORE.BUS.PIPE.VALID, CORE.BUS.PIPE.STAGE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fid-canon = { path = "../fid-canon" }
# CORE.BUS.PRIN builds the `principal_upgrade` entry draft from the journal's entry model.
# CORE.BUS.PIPE.STAGE commits through `Journal::append` and hands reads to the Activity Log
# (`stream`); feature `store` adds the append module. fid-store is already a dependency here.
fid-journal = { path = "../fid-journal", features = ["store"] }
# CORE.BUS.PRIN refuses identifiers that are not NFC; already in the lock (fid-pkg, fid-vocab).
unicode-normalization = "0.1.24"
# CORE.BUS.PIPE.HANDLER checks events against a command definition's declared effects.
fid-registry = { path = "../fid-registry" }
# CORE.BUS.PIPE.HANDLER keys handlers by command ID `name@major`; was a dev-dependency.
fid-types = { path = "../fid-types" }
# CORE.BUS.POL.FS reads the approved roots (an A0 admin setting) through CORE.STO.SET, read only.
# Model layer, below the bus.
fid-store = { path = "../fid-store" }
# CORE.BUS.POL.FS opens resolved files through the root folder held as a capability, so an open
# cannot leave the root (no `unsafe` here; decision D-041, as fid-io-reg). Already in the lock.
cap-std = "3.4"
# CORE.BUS.POL.FS opens the final component without following links (`O_NOFOLLOW`,
# `FILE_FLAG_OPEN_REPARSE_POINT`); the companion crate of cap-std.
cap-fs-ext = "3.4"
# CORE.BUS.UNIT multiplies by the Π constant of GEO.FRAME.UNITS (`PI_256`), which every checked
# quantity catalogue carries. Kernel layer, below the bus; already in the graph via fid-registry.
fid-geo-frame = { path = "../fid-geo-frame" }
# CORE.BUS.UNIT returns the journal entry's `AlgorithmId` type. Kernel layer, zero dependencies;
# already in the graph via fid-journal.
fid-kci = { path = "../fid-kci" }
# CORE.BUS.POL.PROJ: request IDs are UUIDv7 values; the shared UUID type. Layer model, below the
# bus; already in the workspace and the lock.
fid-uuid = { path = "../fid-uuid" }
# CORE.BUS.PIPE.VALID compiles JSON Schema `pattern`/`patternProperties` (an ECMA-262 subset,
# translated) with the `regex` crate: finite automata, matching linear in the input, no
# backtracking, with size and nesting limits. MIT OR Apache-2.0; already in the lock
# (fid-io-reg, fid-vocab), same features.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK, O_NOCTTY and EXDEV constants only (CORE.BUS.POL.FS). Already in the lock.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# CORE.BUS.POL.FS reads a file's hard-link count and attributes from its handle
# (`GetFileInformationByHandle`), which stable std does not expose. Already in the lock via cap-std.
winx = "0.36"

[features]
# `ValidParams::for_tests` for this crate's integration tests; never enabled by other crates.
test-support = []
# CORE.BUS.POL.EGRESS test hooks: `issue_permit_for_tests` (mints a NetPermit outside the
# pipeline), `Destinations::from_value` (destinations not read from the admin setting) and
# `NetworkRootTransport::failing_after_for_tests`. Only `[dev-dependencies]` may enable it;
# `tests/test_hooks.rs` fails if any crate enables it from `[dependencies]`.
permit-test-hooks = []

[dev-dependencies]
# Integration tests build handler parameters through the test-support constructor and use the
# egress test hooks.
fid-bus = { path = ".", features = ["test-support", "permit-test-hooks"] }
# CORE.JRN.CHAIN.VERIFY: `tests/journal_verify_schema.rs` validates real verify and list results
# and parameters against the published schemas with this crate's validator. The journal's
# command definitions come with its `store` feature (already built for this crate via fid-store).
fid-journal = { path = "../fid-journal", features = ["store"] }

[lints]
workspace = true
