[package]
name = "fid-bus"
description = "Metrology Maven command bus: closed error code set, principal model, handler contract, class policy and file handles (spec nodes CORE.BUS.PIPE.ERR, CORE.BUS.PRIN, CORE.BUS.PIPE.HANDLER, CORE.BUS.POL.CLASS, CORE.BUS.POL.FS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fid-canon = { path = "../fid-canon" }
# CORE.BUS.PRIN builds the `principal_upgrade` entry draft from the journal's entry model.
fid-journal = { path = "../fid-journal" }
# CORE.BUS.PRIN refuses identifiers that are not NFC; already in the lock (fid-pkg, fid-vocab).
unicode-normalization = "0.1.24"
# CORE.BUS.PIPE.HANDLER checks events against a command definition's declared effects.
fid-registry = { path = "../fid-registry" }
# CORE.BUS.PIPE.HANDLER keys handlers by command ID `name@major`; was a dev-dependency.
fid-types = { path = "../fid-types" }
# CORE.BUS.POL.FS reads the approved roots (an A0 admin setting) through CORE.STO.SET, read only.
# Model layer, below the bus.
fid-store = { path = "../fid-store" }
# CORE.BUS.POL.FS opens resolved files through the root folder held as a capability, so an open
# cannot leave the root (no `unsafe` here; decision D-041, as fid-io-reg). Already in the lock.
cap-std = "3.4"
# CORE.BUS.POL.FS opens the final component without following links (`O_NOFOLLOW`,
# `FILE_FLAG_OPEN_REPARSE_POINT`); the companion crate of cap-std.
cap-fs-ext = "3.4"

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK, O_NOCTTY and EXDEV constants only (CORE.BUS.POL.FS). Already in the lock.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# CORE.BUS.POL.FS reads a file's hard-link count and attributes from its handle
# (`GetFileInformationByHandle`), which stable std does not expose. Already in the lock via cap-std.
winx = "0.36"

[features]
# `ValidParams::for_tests` for this crate's integration tests; never enabled by other crates.
test-support = []

[dev-dependencies]
# Integration tests build handler parameters through the test-support constructor.
fid-bus = { path = ".", features = ["test-support"] }

[lints]
workspace = true
