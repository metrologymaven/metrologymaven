[package]
name = "fid-project"
description = "Metrology Maven project model: entity ID service, container hierarchy rules and element tree and stages (spec nodes CORE.PRJ.CONT.ID, CORE.PRJ.CONT.HIER, CORE.PRJ.TREE.MODEL, CORE.PRJ.STAGE.MODEL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fid-canon = { path = "../fid-canon" }
# Uuid value and UUIDv5 (moved out so HAL.IDL types need not depend on CORE; re-exported here).
fid-uuid = { path = "../fid-uuid" }
# CORE.PRJ.TREE.MODEL: `sha256:` slot and state digests (AGENTS.md rule 14). Layer num, no dependencies.
fid-types = { path = "../fid-types" }
# Operating-system CSPRNG for the random bits of live UUIDv7s.
getrandom = "0.2"
# CORE.PRJ.CONT.HIER: container labels must be NFC (journaled for good; text rules of #290).
# MIT OR Apache-2.0; already in the tree (fid-bus, fid-pkg, fid-profile, fid-vocab).
unicode-normalization = "0.1.24"

[lints]
workspace = true
