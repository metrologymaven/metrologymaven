[package]
name = "fid-hal-idl"
description = "Metrology Maven device interface types: SI quantities, encodings, frames, timestamps (HAL.IDL.UNITS); provenance stamp, batch envelope and external claim schemas (HAL.IDL.STAMP); typed configuration and configuration digest (HAL.IDL.BASE.CFG); device error model (HAL.IDL.BASE.ERR); Device@1 package, DeviceInstance and Device-core@1 profile (HAL.IDL.BASE.DESC); capability-package/v1 description format (HAL.IDL.GEN.FMT); instrument-profile/v1 descriptor (HAL.IDL.PROFILE); capability negotiation and semver rules (HAL.IDL.NEG); shared streaming template, vendor-extension rule and Stream-common@1 profile (HAL.IDL.SENS.STREAM); LineScan@1 package, columnar profile batches and LineScan-core@1 profile (HAL.IDL.SENS.LINE); Gauge@1 and Environment@1 packages, their readings and the Gauge-core@1 and Environment-core@1 profiles (HAL.IDL.SENS.GAUENV)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Canonical JSON value model (RFC 8785) for the wire forms.
fid-canon = { path = "../fid-canon" }
# Uuid and RFC 9562 UUIDv5 for FrameId (CONSTITUTION §5 derived IDs). Not fid-project:
# HAL.IDL types may not depend on CORE (CONSTITUTION §2.1, D-035).
fid-uuid = { path = "../fid-uuid" }
# Shared `sha256:` digest type (AGENTS.md rule 14); lowest layer, no dependencies.
fid-types = { path = "../fid-types" }

[lints]
workspace = true
