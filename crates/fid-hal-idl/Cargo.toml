[package]
name = "fid-hal-idl"
description = "Metrology Maven device interface value types: SI quantities, declared encodings, frames, timestamps (spec node HAL.IDL.UNITS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Canonical JSON value model (RFC 8785) for the wire forms.
fid-canon = { path = "../fid-canon" }
# Uuid and RFC 9562 UUIDv5 for FrameId (CONSTITUTION §5 derived IDs). Not fid-project:
# HAL.IDL types may not depend on CORE (CONSTITUTION §2.1, D-035).
fid-uuid = { path = "../fid-uuid" }

[lints]
workspace = true
