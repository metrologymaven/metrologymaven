[package]
name = "fid-plat-matrix"
description = "Metrology Maven support matrix: schema, strict validator and tier lookup (spec node PLAT.MATRIX.FILE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "plat-matrix"
path = "src/main.rs"

[dependencies]
# Reads the matrix as an untyped table (no serde derive); same pinned dependency as fid-knp1-lint,
# already in Cargo.lock. Duplicate keys and malformed TOML are rejected by the parser.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
