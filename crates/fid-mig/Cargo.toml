[package]
name = "fid-mig"
description = "Metrology Maven migration: the `mig-ladder@1` ladder and its stage-independence check (MIG.LADDER.DEF); the `mig-sources@1` incumbent source register, its sources check and `migrate.list_sources@1` (MIG.SRC.REG); migration corpus manifests and the corpus check (MIG.COVER.CORPUS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# MIG.EXPLAIN.CAT: principal identification (CORE.BUS.PRIN) and factor setting schema validation
# (`fid_bus::validate::Compiled`), engine layer, below this crate.
fid-bus = { path = "../fid-bus" }
# Bounded JSON parsing and the RFC 8785 canonical form behind the ladder digest (CORE.JRN.CANON).
fid-canon = { path = "../fid-canon" }
# Shared command IDs and the `sha256:` digest type (AGENTS.md rule 14).
fid-types = { path = "../fid-types" }
# MIG.SRC.REG: format IDs follow the format registry's ID rules (IO.REG.DETECT `FormatId`);
# same services layer.
fid-io-reg = { path = "../fid-io-reg" }
# MIG.SRC.REG: the registry definition of `migrate.list_sources@1` (CORE.REG.DEF, model layer).
fid-registry = { path = "../fid-registry" }
# MIG.COVER.CORPUS: reads the dataset catalogue (`datasets.toml`, ECO.DATA.CAT) as an untyped table,
# like fid-accept and fid-xtask (same version and feature set, already in the lock). fid-data owns the
# catalogue's own parser but is a `tool` crate, which this `services` crate may not depend on.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
