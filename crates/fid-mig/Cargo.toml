[package]
name = "fid-mig"
description = "Metrology Maven migration: the `mig-ladder@1` ladder and its stage-independence check (MIG.LADDER.DEF); the `mig-sources@1` incumbent source register, its sources check and `migrate.list_sources@1` (MIG.SRC.REG)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Bounded JSON parsing and the RFC 8785 canonical form behind the ladder digest (CORE.JRN.CANON).
fid-canon = { path = "../fid-canon" }
# Shared command IDs and the `sha256:` digest type (AGENTS.md rule 14).
fid-types = { path = "../fid-types" }
# MIG.SRC.REG: format IDs follow the format registry's ID rules (IO.REG.DETECT `FormatId`);
# same services layer.
fid-io-reg = { path = "../fid-io-reg" }
# MIG.SRC.REG: the registry definition of `migrate.list_sources@1` (CORE.REG.DEF, model layer).
fid-registry = { path = "../fid-registry" }

[dev-dependencies]
# MIG.SRC.REG: parameters and results are validated with the bus's own schema evaluator
# (`fid_bus::validate::Compiled`), engine layer, below this crate.
fid-bus = { path = "../fid-bus" }

[lints]
workspace = true
