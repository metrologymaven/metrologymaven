[package]
name = "fid-io-dmis"
description = "Metrology Maven DMIS 5.3 support: conformance table (IO.DMIS.CONF), bounded lexer (IO.DMIS.PARSE.LEX), statement tree (IO.DMIS.PARSE.TREE), definition grammar (IO.DMIS.PARSE.GDEF), canonical printer (IO.DMIS.PARSE.PRINT) and vendor dialect profiles (IO.DMIS.DIAL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dmis-conformance"
path = "src/bin/dmis-conformance.rs"

[[bin]]
name = "dmis-classes"
path = "src/bin/dmis-classes.rs"

[dependencies]
# Reader harness (IO.REG.LIMITS): bounded source, budget, error taxonomy, untrusted text.
fid-io-reg = { path = "../fid-io-reg" }
# RFC 8785 canonical JSON writer and SHA-256 (CORE.JRN.CANON).
fid-canon = { path = "../fid-canon" }
# Command definition for import.dmis_list_dialects@1 (IO.DMIS.DIAL). Layer model.
fid-registry = { path = "../fid-registry" }
# Shared `sha256:` digests (AGENTS.md rule 14). Layer num.
fid-types = { path = "../fid-types" }
# Reads the support-declaration and dialect profile files as untyped TOML tables.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
