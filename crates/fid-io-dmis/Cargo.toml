[package]
name = "fid-io-dmis"
description = "Metrology Maven DMIS 5.3 support: conformance table (IO.DMIS.CONF), bounded lexer (IO.DMIS.PARSE.LEX) and statement tree (IO.DMIS.PARSE.TREE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dmis-conformance"
path = "src/bin/dmis-conformance.rs"

[[bin]]
name = "dmis-classes"
path = "src/bin/dmis-classes.rs"

[dependencies]
# Reader harness (IO.REG.LIMITS): bounded source, budget, error taxonomy, untrusted text.
fid-io-reg = { path = "../fid-io-reg" }
# RFC 8785 canonical JSON writer for dmis-conformance.json (the project's canonical-JSON crate).
fid-canon = { path = "../fid-canon" }
# Reads the support-declaration file as an untyped table, like fid-accept, fid-vocab and fid-xtask.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
