[package]
name = "fid-eval-suite"
description = "Metrology Maven evaluation suite format: task and oracle files, fail-closed parser, suite version digest and the suite consistency, coverage and oracle isolation check (spec nodes AGENT.EVAL.FORMAT, AGENT.EVAL.CHECK)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The `fid-eval` binary (D-032): evaluation tooling outside the registry.
[[bin]]
name = "fid-eval"
path = "src/main.rs"

[dependencies]
fid-canon = { path = "../fid-canon" }
# Predicate schema and parser shared with fid-eval-harness (AGENT.REDTEAM.PRED).
fid-eval-pred = { path = "../fid-eval-pred" }
fid-types = { path = "../fid-types" }

[lints]
workspace = true
