version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The `fid-eval` binary (D-032): evaluation tooling outside the registry.
[[bin]]
name = "fid-eval"
path = "src/main.rs"

[dependencies]
fid-canon = { path = "../fid-canon" }
fid-types = { path = "../fid-types" }

[lints]
workspace = true
