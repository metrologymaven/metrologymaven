[package]
name = "fid-geo-index"
description = "Metrology Maven spatial indexes: the deterministic triangle bounding volume hierarchy (spec node GEO.INDEX.BVH) and the point k-d tree with exact k-nearest, radius and box queries (spec node GEO.INDEX.KDTREE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Kernel crate (KNP-1): no third-party dependencies. Only kernel-layer workspace crates:
# fid-geo-types (the validated Mesh, FrameRef and the totalOrder Aabb) and fid-geo-frame
# (Transform, to map a ray from another frame into the mesh frame).
[dependencies]
fid-geo-types = { path = "../fid-geo-types" }
fid-geo-frame = { path = "../fid-geo-frame" }

# Test-only: SHA-256 for the fixture digests (fid-kci), the KNP-1 sqrt that regenerates the
# pinned sphere mesh (fid-num), and the counting allocator for AC-1 (cap).
[dev-dependencies]
cap = { version = "0.1.2", features = ["stats"] }
fid-kci = { path = "../fid-kci" }
fid-num = { path = "../fid-num" }

[[bench]]
name = "index"
harness = false

[lints]
workspace = true
