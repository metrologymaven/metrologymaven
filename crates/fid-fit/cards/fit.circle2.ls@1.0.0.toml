# Spec card (KRN.LSQ.RND). Cite designators and clause numbers only; never paste standards text.
id = "fit.circle2.ls@1.0.0"
title = "Least-squares circle in a projection plane"
method = "Projects the points orthogonally onto the projection plane (default z = 0; in-plane frame as fit.line2.ls) and minimises the sum of squared in-plane distances rho_i - r on centred, scaled data by Levenberg-Marquardt (fid_solv::nlls) with an analytic Jacobian, from the algebraic (Kasa) circle solved by blocked Householder QR. Optional fixed radius. The centre is reported in the plane's coordinates."
applicability = "At least 3 projected points, not collinear, with angular coverage at least thresholds.min_coverage (30 degrees through ls_rnd::default_params [unverified]; the contract's own default is 20 degrees)."
references = [
  "Shakarji, C. M. (1998). Least-squares fitting algorithms of the NIST algorithm testing system. Journal of Research of the National Institute of Standards and Technology 103(6).",
  "Kasa, I. (1976). A circle fitting procedure and its error analysis. IEEE Transactions on Instrumentation and Measurement 25(1). [unverified citation]",
  "More, J. J. (1978). The Levenberg-Marquardt algorithm: implementation and theory. Lecture Notes in Mathematics 630.",
]
determinism = "D0"
input_arity = "1"
failure_modes = [
  "Short arcs: centre and radius are strongly correlated and the noise is amplified; below the coverage threshold the fit is refused with insufficient_coverage.",
  "Collinear projections (a plane seen edge on): Collinear; a degenerate algebraic start: IllConditioned.",
  "The Kasa start is biased towards small radii on short noisy arcs; the iteration corrects it, but convergence slows as coverage falls.",
]
validation = "Decimal (60-digit) Gauss-Newton reference of the same least-squares problem: fixtures/fit/rnd-partial-v1 (make_rnd_fixtures.py), checked on x86-64, ARM64 and wasm32. Pending: NIST ATS circle sets through UNC.RDL (D-038)."
