# Spec card (KRN.ENV.TAN.PLANE). Cite designators and clause numbers only; never paste standards text.
id = "fit.plane.tan_minimax@1.0.0"
title = "External minimax tangential plane"
method = "The plane on the material-free side of the points that touches them and has the smallest largest depth (perpendicular distance into the material); its depth range is the width of the points along its normal. Parameters (a, b, c, e) in a frame about the outward least-squares normal: tangent plane w = c + a u + b v above every point, far plane w = e + a u + b v below every point, value (c - e) / sqrt(1 + a^2 + b^2). Every constraint is linear; sequential linearisation (KRN.SOLV.SEQ) from 1 + 4 ring + seeded random starts, each result certified (KRN.SOLV.CERT) as a KKT vertex of 4 active rows, so a strict local minimum. With a fixed normal the plane passes through the extreme point (exact)."
applicability = "At least 3 points not collinear (free normal), at least 1 (fixed normal); a material side (outward direction or per-point normals) not perpendicular to the least-squares normal. Best on plates whose least-squares normal is near the minimum-width direction."
references = [
  "Shakarji, C. M. and Srinivasan, V. (2012 to 2015). Papers on datum plane establishment by constrained least squares and L1 fitting [unverified citation].",
  "Conn, A. R., Gould, N. I. M. and Toint, P. L. (2000). Trust-Region Methods. SIAM [unverified chapter].",
]
determinism = "D0"
input_arity = "1"
failure_modes = [
  "A face with many exactly coplanar points on either side gives more candidate bases than KRN.SOLV.CERT.AS lists: SeqFailed (cert), no value.",
  "Every start failing (iteration limit, collapsed step bound, certificate_failed): SeqFailed, never an uncertified iterate.",
]
validation = "Exact rational oracle fixtures/fit/tan-plane-v1 (make_tan_plane_fixtures.py: global optimum by enumeration over hull supports, isqrt rounding), checked on x86-64, ARM64 and wasm32 with an output-bit pin."
