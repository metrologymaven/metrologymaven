# Spec card (KRN.ENV.MIC.CIRSPH). Cite designators and clause numbers only; never paste standards text.
id = "fit.circle2.mi@1.0.0"
title = "Maximum inscribed 2D circle in a trust region"
method = "The largest circle in the projection plane containing no point, with its centre held in the trust region of KRN.ENV.MIC.TR (fraction tr_fraction of the least-squares radius, fit.circle2.ls, 32-gon or 26-facet polyhedron). Parameters: centre and radius on centred, scaled data; rows r - |q_i - c| <= 0 and the region's facets; objective -r. Sequential linear programming (fid_solv::seq): each step linearises |q_i - c| about the current centre, which is conservative because the distance is convex, so every step is feasible. Seeded multi-start (fid_solv::mstart, 8 starts in half the region's inradius), each start certified by the active-set certificate pipeline (fid_solv::cert: 3 independent active rows with positive multipliers, a strict local maximum). The radius is recomputed from the contacts. A branch and bound over the region on the 1-Lipschitz empty-ball radius, with candidate lists and rounding margins, then proves that no centre in the region beats the radius by more than 1e-9 relative plus the certificate's value bound (global), finds one, or runs out of its limits."
applicability = "Points in SI metres, projected onto a plane (default z = 0); the least-squares circle must succeed (count, rank, coverage, conditioning). tr_fraction is required (no default) and boundary_tol must be at least the trust region's rounding floor. An optimum with fewer than 3 contacts (symmetric ovality) or with tied contacts beyond the certificate's candidate cap is not certifiable and is refused. Global optimality is proven only inside the trust region."
references = [
  "Toussaint, G. T. (1983). Computing largest empty circles with location constraints. International Journal of Computer and Information Sciences 12(5), 347-358 [unverified citation details].",
  "Conn, A. R., Gould, N. I. M. and Toint, Ph. L. (2000). Trust-Region Methods. SIAM.",
  "ISO 14405-1:2016, clause 3.6 (maximum inscribed size) [unverified clause number].",
]
determinism = "D0"
input_arity = "1"
failure_modes = [
  "Partial coverage (an arc or cap): the empty circle grows away from the data and its centre reaches the trust region's boundary: unbounded_envelope with the boundary distance, never a result.",
  "Fewer than 3 contacts at the optimum (for example a two-lobed oval) or near-tied contacts: no certifiable active set: solver (seq cause cert), fail closed.",
  "Non-convex: starts can certify different local maxima (agreement false). The branch and bound decides global optimality; if it finds a better centre or exhausts its limits (very large or near-degenerate data) the result is local_optimum_only and the Fit trait refuses it (flagged_fit).",
  "A point inside the recomputed envelope by more than 1e-12 m: side_violation.",
  "tr_fraction missing or not positive, boundary_tol below the floor, a method other than mi, weights or constraints other than a projection plane: invalid_params.",
]
validation = "fixtures/fit/mic-cirsph-v1 (make_mic_cirsph_fixtures.py): seeded three-lobed holes of 50 to 100 000 points with outward-only form, whose inscribed circle is fixed by three planted valley points (exact rational circumcentre, separation of every other point checked, centre strictly inside the contacts' triangle): radius within 1e-11 m of the oracle and 1e-8 m of the analytic R - A, centre within 1e-11 m, contacts exact, global cross-check passed. 60-degree arcs: unbounded_envelope, and the Voronoi circle (fit.circle2d.mic_vor) on the same trust polygon reports on_region_boundary. Agreement job against fit.circle2d.mic_vor on every fixture circle up to 5 000 points: centre and radius within 1e-9 m, same boundary status; injected 1e-8 m shifts fail it. Output bits pinned on x86-64, ARM64 and wasm32. Pending: the frozen UNC.RDL.FREEZE reference set."
