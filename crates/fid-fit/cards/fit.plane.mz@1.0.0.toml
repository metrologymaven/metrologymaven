# Spec card (KRN.MZ.LIN.FLAT). Cite designators and clause numbers only; never paste standards text.
id = "fit.plane.mz@1.0.0"
title = "Minimum-zone 3D plane (Chebyshev flatness)"
method = "Centres and power-of-two scales the point cloud and starts from the orthogonal least-squares plane normal. In the local orthonormal frame (u, v in LS plane, w along LS normal divided by exact power-of-two form scale k), solves for parallel bounding planes w = c + a u + b v and w = e + a u + b v minimising exact orthogonal zone width (c - e) / sqrt(1 + k^2 (a^2 + b^2)) subject to linear constraints via sequential LP (KRN.SOLV.SEQ) and certifies a 4-row (3-1, 1-3, or 2-2) KKT active-set vertex (KRN.SOLV.CERT, CertKind::Zone). Reports the mid-zone plane and recomputes the zone width from the critical point set."
applicability = "At least 3 non-collinear points in 3D (at least 1 with a fixed normal). Finite, non-subnormal SI metre coordinates. Exact coplanar input yields width 0.0 closed-form."
references = [
  "ISO 12781-1:2011, Geometrical product specifications (GPS) - Flatness - Part 1: Vocabulary and parameters of flatness.",
  "Conn, A. R., Gould, N. I. M. and Toint, P. L. (2000). Trust-Region Methods. SIAM [unverified chapter].",
]
determinism = "D0"
input_arity = "1"
failure_modes = [
  "Fewer than 3 points or collinear points (numerical rank < 2): TooFewPoints or Collinear.",
  "Solver or KKT certification fails across all deterministic starts: SeqFailed (fail closed, never returns an uncertified iterate).",
  "Certified zone leaves a point outside beyond SIDE_TOL: SideViolation (fail closed).",
]
validation = "Exact rational analytical generator fixtures/fit/mz-flat-v1 (make_mz_flat_fixtures.py) covering 3-1, 1-3, and 2-2 critical sets and 1 km offset from origin, independent active-set width recomputation bit-identity check, and cross-target output-digest pin on x86-64, ARM64 and wasm32."
