[package]
name = "fid-outreach"
description = "Metrology Maven outreach tooling (domain OUTR): adoption metric definitions, launch plan checks, site and docs quality gates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fid-outreach"
path = "src/main.rs"

# toml: reads the definition, source, criteria, app-list and base files as untyped tables (no serde derive); same pinned
# dependency as fid-platform and fid-knp1-lint, already in Cargo.lock. Duplicate keys and
# malformed TOML are rejected by the parser. fid-canon: writes the --json reports as canonical JSON,
# and reads the a11y token and configuration JSON. HTML and CSS (qa a11y) use bounded in-house parsers.
# fid-types: side-effect and determinism classes, command names and sha256: digests read from the
# docs-ref-v1 records (ref-render, ref-check), and the digest type of the site import lock file.
# sha2 (site import, OUTR.SITE.GEN.IMPORT): streaming SHA-256 of vendored inputs; sha2 0.10 is
# already in the graph through fid-canon.
[dependencies]
fid-canon = { path = "../fid-canon" }
fid-types = { path = "../fid-types" }
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
