[package]
name = "fid-outreach"
description = "Metrology Maven outreach tooling (domain OUTR)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fid-outreach"
path = "src/main.rs"

# toml: reads the definition and source files as untyped tables (no serde derive); same pinned
# dependency as fid-platform and fid-knp1-lint, already in Cargo.lock. Duplicate keys and
# malformed TOML are rejected by the parser. fid-canon: writes the --json report as canonical JSON.
[dependencies]
fid-canon = { path = "../fid-canon" }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
