[package]
name = "fid-scan-sect"
description = "Metrology Maven section definitions: SectionDef (single plane, parallel and radial plane series, plane of a CAD face or constructed plane), validation, expansion into ordered cutting planes and the canonical digest (spec node SCAN.SECT.DEF)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Kernel crate (KNP-1): no third-party dependencies. Only num- and kernel-layer workspace crates:
# fid-num (the KNP-1 `sin`, `cos`, `norm2` and `dot` for the radial series and the unit checks),
# fid-kci (the portable SHA-256 of the canonical definition), fid-types (the `sha256:` Digest),
# fid-geo-cad (the B-rep body, its digest and GEO.CAD.NOMINAL.DIRECT `map_face`, so a
# `FromElement` definition resolves the plane of a planar CAD face), fid-construct (the
# constructed-element ID and output digest, KRN.CONS.DECL) and fid-fit (the `FittedFeature`
# plane a constructed element carries).
[dependencies]
fid-construct = { path = "../fid-construct" }
fid-fit = { path = "../fid-fit" }
fid-geo-cad = { path = "../fid-geo-cad" }
fid-kci = { path = "../fid-kci" }
fid-num = { path = "../fid-num" }
fid-types = { path = "../fid-types" }

[dev-dependencies]
# Test-support only (never in the kernel graph): the workspace root for fixture paths.
fid-testkit = { path = "../fid-testkit" }

[lints]
workspace = true
