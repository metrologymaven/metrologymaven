[package]
name = "fid-gps"
description = "Metrology Maven GD&T evaluation library; today the Dialect Mapping Table schema (GDT.RES.SCHEMA), the pure interpretation resolver (GDT.RES.RESOLVE), the tolerance-zone shapes with fixed-pose usage (GDT.ZONE.ZTYPE), shared-pose group identity and pose digests (GDT.ZONE.GROUP.IDS), DRF construction with its measured planar and cylindrical paths (GDT.DRF.BUILD) and the diameter and radius checks (GDT.DIM.RADIAL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# RFC 8785 canonical JSON parser and writer plus SHA-256 (CORE.JRN.CANON): strict, bounded
# table parsing (duplicate JSON keys, size and depth limits) and the row, chain and table digests.
fid-canon = { path = "../fid-canon" }
# Shared `sha256:` digest type (AGENTS.md rule 14).
fid-types = { path = "../fid-types" }
# UUIDv5 derivation for shared-pose group identities (GDT.ZONE.GROUP.IDS; same layer: model).
fid-uuid = { path = "../fid-uuid" }
# Correctly rounded square root (KRN.NUM.FN) for the zone-shape distances (GDT.ZONE.ZTYPE)
# and the DRF axes (GDT.DRF.BUILD), with NaN as an error.
fid-num = { path = "../fid-num" }
# The validated rigid transform a zone pose can be taken from (GEO.FRAME.XFORM).
fid-geo-frame = { path = "../fid-geo-frame" }
# GDT.DRF.BUILD (measured path): the certified tangential plane of KRN.ENV.TAN.PLANE that
# simulates each planar datum and the certified minimum circumscribed cylinder of
# KRN.ENV.MCC.CYL that simulates each external cylindrical datum (kernel layer, below model;
# KNP-1, no third-party deps). GDT.DIM.RADIAL: the least-squares circle, sphere (KRN.LSQ.RND)
# and cylinder (KRN.LSQ.AXIS.CYL) fits whose radius it reports.
fid-fit = { path = "../fid-fit" }

[lints]
workspace = true
