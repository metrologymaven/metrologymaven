[package]
name = "fid-gps"
description = "Metrology Maven GD&T evaluation library; today the Dialect Mapping Table schema (GDT.RES.SCHEMA), the pure interpretation resolver (GDT.RES.RESOLVE), the tolerance-zone shapes with fixed-pose usage (GDT.ZONE.ZTYPE), shared-pose group identity and pose digests (GDT.ZONE.GROUP.IDS), DRF construction with its measured planar and cylindrical paths (GDT.DRF.BUILD), the datum target coverage check (GDT.DRF.COMMON.COVER), the diameter and radius checks (GDT.DIM.RADIAL) the profile deviations from nominal (GDT.PROF.DEV), the constant-width profile zone definitions (GDT.PROF.ZDEF.UNIF), the line-profile section bands (GDT.PROF.LINE.SECT), the ISO rank-order size statistics (GDT.DIM.SIZEISO.RANK), 2D elements from section-curve spans (GDT.DIM.SECT.SPAN), the derived-element type and dispatch (GDT.LOC.DERIV.TYPES) and the axis of an associated feature (GDT.LOC.DERIV.AXIS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# RFC 8785 canonical JSON parser and writer plus SHA-256 (CORE.JRN.CANON): strict, bounded
# table parsing (duplicate JSON keys, size and depth limits) and the row, chain and table digests.
fid-canon = { path = "../fid-canon" }
# Shared `sha256:` digest type (AGENTS.md rule 14).
fid-types = { path = "../fid-types" }
# UUIDv5 derivation for shared-pose group identities (GDT.ZONE.GROUP.IDS; same layer: model).
fid-uuid = { path = "../fid-uuid" }
# Correctly rounded square root (KRN.NUM.FN) for the zone-shape distances (GDT.ZONE.ZTYPE)
# and the DRF axes (GDT.DRF.BUILD), with NaN as an error.
fid-num = { path = "../fid-num" }
# The validated rigid transform a zone pose can be taken from (GEO.FRAME.XFORM).
fid-geo-frame = { path = "../fid-geo-frame" }
# GDT.DRF.BUILD (measured path): the certified tangential plane of KRN.ENV.TAN.PLANE that
# simulates each planar datum and the certified minimum circumscribed cylinder of
# KRN.ENV.MCC.CYL that simulates each external cylindrical datum (kernel layer, below model;
# KNP-1, no third-party deps). GDT.DIM.RADIAL: the least-squares circle, sphere (KRN.LSQ.RND)
# and cylinder (KRN.LSQ.AXIS.CYL) fits whose radius it reports.
fid-fit = { path = "../fid-fit" }
# GDT.DRF.COMMON.COVER: the measured points (GEO.TYPES.POINTS `PointBuffer`) and the
# deterministic k-d tree whose exact nearest-point query gives each coverage distance
# (GEO.INDEX.KDTREE). Both kernel layer, KNP-1, no third-party deps.
fid-geo-index = { path = "../fid-geo-index" }
fid-geo-types = { path = "../fid-geo-types" }
# GDT.PROF.DEV: the B-rep body and trim classification (GEO.CAD.TOPO.MODEL, TRIM), the
# face-set closest point and CAD sign (GEO.DIST.FACE.BODY, INCID) and the analytic surface
# kinds (GEO.NURBS.ANALYTIC, to refuse torus faces). All kernel layer, KNP-1, no third-party deps.
fid-geo-cad = { path = "../fid-geo-cad" }
fid-geo-dist = { path = "../fid-geo-dist" }
fid-geo-nurbs = { path = "../fid-geo-nurbs" }

[lints]
workspace = true
