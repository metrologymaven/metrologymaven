[package]
name = "fid-gpu-policy"
description = "Metrology Maven GPU backend policy and known-bad driver list (spec node PLAT.GPU.POLICY): schemas, validators, safe defaults and known-bad lookup, below the tool layer for PLAT.GPU.DETECT; re-exported by fid-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Reads the two files as untyped tables (no serde derive); the same pinned parser fid-platform
# used for them, already in Cargo.lock. Duplicate keys and malformed TOML are rejected.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
