[package]
name = "fid-io-reg"
description = "Metrology Maven reader harness: limits, bounded source, IoError taxonomy, untrusted text, root handles, import and export reports, atomic export writes (spec nodes IO.REG.LIMITS, IO.REG.ROOTS, IO.REG.ENV.REPORT, IO.REG.WRITE), format registry and detection (IO.REG.DETECT), export command and skeleton (IO.REG.ENV.EXPORT), import command and skeleton (IO.REG.ENV.IMPORT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test seams `RootSet::set_race_hook` (IO.REG.ROOTS REQ-005 race tests) and
# `AtomicWriter::fail_after` (IO.REG.WRITE AC-3 fault injection). Off by default;
# enabled only through the dev-dependency below, never in shipped builds.
test-hooks = []
# IO.REG.ENV.IMPORT: the `CasBlobs` adapter over the project blob store (CORE.STO.CAS).
# Off by default, so the harness stays free of the store (and its bundled SQLite) for its
# pure users; the tests enable it through the dev-dependency below.
cas = ["dep:fid-store"]

[dependencies]
# IO.REG.ENV.IMPORT: the element tree, stages and IDs an import commits into
# (CORE.PRJ.TREE.MODEL, CORE.PRJ.STAGE.MODEL). Layer model, no store.
fid-project = { path = "../fid-project" }
# IO.REG.ENV.IMPORT `cas` feature only. Layer model.
fid-store = { path = "../fid-store", optional = true }
fid-types = { path = "../fid-types" }
# RFC 8785 canonical JSON for report digests (IO.REG.ENV.REPORT REQ-003).
fid-canon = { path = "../fid-canon" }
# Capability-based directory handles: opens relative to an opened root that cannot
# escape it, without `unsafe` here (IO.REG.ROOTS REQ-005, CONSTITUTION §8, decision D-041).
cap-std = "3.4"
# Streaming SHA-256 of written export files (IO.REG.WRITE REQ-004); the sha2 0.10 fid-canon
# already brings into the graph.
sha2 = "0.10"
# IO.REG.DETECT: the shared `computed` result envelope of `import.list_formats@1` /
# `export.list_formats@1` (AUTO.SURF.ENV), and the replay outcome class of AC-7 (CORE.RPL.CLASS).
# Both are workspace crates at or below the services layer.
fid-surface = { path = "../fid-surface" }
fid-replay = { path = "../fid-replay" }
# IO.REG.PROV: the length units with their exact ratios, frame IDs, `Frame` and the identity
# transform (GEO.FRAME, kernel layer), and the journal's principal kind (CORE.JRN.ENTRY, model
# layer; default features only, so no storage).
fid-geo-frame = { path = "../fid-geo-frame" }
fid-journal = { path = "../fid-journal" }
# IO.REG.ENV.EXPORT: the registry definitions of `export.file@1` and `export.<format>@1`
# (CORE.REG.DEF, model layer; already in this crate's tree through fid-replay).
fid-registry = { path = "../fid-registry" }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK, O_NOCTTY and EXDEV constants only.
libc = "0.2"

[dev-dependencies]
# Integration tests use the race hook.
fid-io-reg = { path = ".", features = ["test-hooks", "cas"] }
# IO.REG.ENV.IMPORT: the CAS adapter test opens a real blob store.
fid-store = { path = "../fid-store" }
# IO.REG.ENV.EXPORT tests evaluate the published schema patterns with a real regex engine.
# Already in the lock (fid-vocab), same features.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[lints]
workspace = true
