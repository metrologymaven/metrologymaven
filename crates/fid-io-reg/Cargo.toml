[package]
name = "fid-io-reg"
description = "Metrology Maven reader harness: limits, bounded source, IoError taxonomy, untrusted text, root handles (spec nodes IO.REG.LIMITS, IO.REG.ROOTS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fid-types = { path = "../fid-types" }
# Capability-based directory handles: opens relative to an opened root that cannot
# escape it, without `unsafe` here (IO.REG.ROOTS REQ-005, CONSTITUTION §8, decision D-041).
cap-std = "3.4"

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK, O_NOCTTY and EXDEV constants only.
libc = "0.2"

[lints]
workspace = true
