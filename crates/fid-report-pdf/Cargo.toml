[package]
name = "fid-report-pdf"
description = "Metrology Maven PDF report renderer: bundled fonts, shaping, subsetting and PDF text objects (spec node RPT.OUTPUT.PDF.TEXT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Shared `sha256:` digest type (font manifest digests).
fid-types = { path = "../fid-types" }
# The kernel formatter (KRN.NUM.FMT.LEN): measured values are shaped from its output verbatim.
fid-num = { path = "../fid-num" }
# SHA-256 of font files and subset glyph lists; already in the graph through fid-canon.
sha2 = "0.10"

# Host-only dependencies for `report.export_pdf@1` (W1, `fs_effect = write_root`),
# writing through `RPT.OUTPUT.META`'s `ExportSink` (cap-std) and registering CLI/MCP schemas.
# Core layout, painting, and deterministic PDF serialisation remain 100% wasm32-wasip1 portable.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fid-bus = { path = "../fid-bus" }
fid-canon = { path = "../fid-canon" }
fid-io-reg = { path = "../fid-io-reg" }
fid-registry = { path = "../fid-registry" }
fid-report = { path = "../fid-report" }
fid-report-out = { path = "../fid-report-out" }

[lints]
workspace = true
