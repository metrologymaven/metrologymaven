[package]
name = "fid-cli"
description = "The `fid` command-line interface of Metrology Maven"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fid"
path = "src/main.rs"

[dependencies]
fid-canon = { path = "../fid-canon" }
# AUTO.CTRL.CLIENT: the control-channel client behind `fid ctrl status` and `fid ctrl ping`.
fid-ctrl = { path = "../fid-ctrl" }
fid-surface = { path = "../fid-surface" }
fid-types = { path = "../fid-types" }

[dev-dependencies]
# AUTO.CLI.DISPATCH AC-6: the workspace registry manifest, whose flag tables must build with no
# collision (tests/dispatch_workspace.rs). Dev-only, like fid-mcp's; layer services.
fid-registry-build = { path = "../fid-registry-build" }

[lints]
workspace = true
