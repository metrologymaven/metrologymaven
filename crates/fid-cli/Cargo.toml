[package]
name = "fid-cli"
description = "The `fid` command-line interface of Metrology Maven"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fid"
path = "src/main.rs"

[dependencies]
fid-canon = { path = "../fid-canon" }
fid-surface = { path = "../fid-surface" }
# `fid migrate list-sources` (MIG.SRC.REG): the source register and `migrate.list_sources@1`
# (services layer, below this app crate).
fid-mig = { path = "../fid-mig" }

[lints]
workspace = true
