[package]
name = "fid-report-forms"
description = "Metrology Maven FAI and PPAP forms data model, header/accountability commands and locked form layout field-map machinery (spec nodes RPT.FORMS.HDR, RPT.FORMS.LAYOUT.MAP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# RFC 8785 canonical JSON, bounded parsing and SHA-256 digests (CORE.JRN.CANON).
fid-canon = { path = "../fid-canon" }
# Characteristic model IDs (GDT.CHAR.MODEL). Layer services.
fid-gdt = { path = "../fid-gdt" }
# UUIDv7 generation and Uuid type (CORE.PRJ.CONT.ID). Layer model.
fid-project = { path = "../fid-project" }
# CommandDef schema validation (CORE.REG). Layer model.
fid-registry = { path = "../fid-registry" }
# ReplayOutcome class (CORE.RPL.CLASS). Layer engine.
fid-replay = { path = "../fid-replay" }
# Untrusted<Text>, templates, binding traits and formatting (RPT.MODEL.*). Layer services.
fid-report = { path = "../fid-report" }
# Shared sha256 Digest type (AGENTS.md rule 14). Layer num.
fid-types = { path = "../fid-types" }

[dev-dependencies]
# IO principal & roots for AC-2 locked template save rejection test.
fid-io-reg = { path = "../fid-io-reg" }
# Kernel decision and unit formatting types for AC-4 RPT.MODEL.FMT integration tests only.
fid-kdec = { path = "../fid-kdec" }
fid-num = { path = "../fid-num" }

[lints]
workspace = true
