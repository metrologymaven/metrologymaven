[package]
name = "fid-accept"
description = "Metrology Maven acceptance tooling: journey-map format (FLOW.PERSONA.SCHEMA), personas (FLOW.PERSONA.PERS), study tasks (FLOW.STUDY.PROTO), acceptance-job packages (FLOW.RUNNER.PKG), and nightly acceptance report / trend history (FLOW.RUNNER.VERDICT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Bounded JSON parser that rejects duplicate keys (the project's canonical-JSON crate).
fid-canon = { path = "../fid-canon" }
# CommandDef declaration for `accept.show_report@1` (FLOW.RUNNER.VERDICT).
fid-registry = { path = "../fid-registry" }
# Shared command-ID syntax (`name@major`) and digests (AGENTS.md rule 14).
fid-types = { path = "../fid-types" }
# Streaming SHA-256 of golden journals (FLOW.RUNNER.PKG); same crate and version as fid-canon.
sha2 = "0.10"
# Reads the ECO.APPS.LIST app list (`apps.toml`) as an untyped table, like fid-vocab and fid-xtask.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
