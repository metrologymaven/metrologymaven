version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Kernel crate (KNP-1): no third-party dependencies, only fid-num (exact decimals) and
# fid-types (the shared Determinism class, AGENTS.md rule 14), both num layer, so that CORE
# (below UNC) and the WASM verifier can both use it.
