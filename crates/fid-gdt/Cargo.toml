[package]
name = "fid-gdt"
description = "Metrology Maven GD&T characteristics and DMT workflow; today the DMT reviewer roster (GDT.RES.ROWFLOW.ROSTER), the row review state machine (GDT.RES.ROWFLOW.STATE), defaults profiles (GDT.CHAR.DPROF), governing specs (GDT.CHAR.SPEC), characteristic identity (GDT.CHAR.IDENT), the resolver commands (GDT.RES.RESOLVE), ResultRecord assembly (GDT.CHAR.RECORD) and datum definitions (GDT.DRF.DATUM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# RFC 8785 canonical JSON parser and writer plus SHA-256 (CORE.JRN.CANON): strict roster
# parsing (duplicate keys, size and depth limits) and the roster digest.
fid-canon = { path = "../fid-canon" }
# Shared `sha256:` digest type (AGENTS.md rule 14).
fid-types = { path = "../fid-types" }
# GDT.CHAR.DPROF: profiles are read through approved import handles (agents never pass raw
# paths, CONSTITUTION §3); the principal type comes from here too. Same layer (services).
fid-io-reg = { path = "../fid-io-reg" }
# GDT.RES.SCHEMA: the DMT schema owns the defaults-profile key vocabulary that DPROF checks
# profiles against, and the label grammar SPEC uses for standard designators and editions;
# GDT.RES.RESOLVE: the pure resolver its commands wrap (model layer, below services).
fid-gps = { path = "../fid-gps" }
# GDT.CHAR.DPROF AC-7: replay outcomes and their aggregation (engine layer, below services).
fid-replay = { path = "../fid-replay" }
# GDT.CHAR.RECORD: decisions enter a ResultRecord only as the typed UNC decision of the
# kernel decision crate, and the uncertainty with its evidence facts only from a validated
# UNC statement (kernel layer, below services; no third-party dependencies).
fid-kdec = { path = "../fid-kdec" }
fid-kunc = { path = "../fid-kunc" }
# GDT.CHAR.RECORD: the registry definition of `gdt.get_result@1`, built through the
# registry's field rules (CORE.REG.DEF), as fid-align does for its reads. Layer model.
fid-registry = { path = "../fid-registry" }
# GDT.CHAR.IDENT: every identity goes through the project ID service (IdService, IdIndex,
# ObservationSource and Uuid; CORE.PRJ.CONT.ID, model layer).
fid-project = { path = "../fid-project" }

# GDT.RES.ROWFLOW.STATE: authors and reviewers are bus-derived principals (CORE.BUS.PRIN), the
# only way to learn a principal's kind, so a request can never claim to be human (the
# AUTO.REC.ADOPT pattern). Engine layer, below services; fid-journal and fid-store, which it
# builds on, are already in this crate's tree through fid-io-reg.
fid-bus = { path = "../fid-bus" }

[dev-dependencies]
# GDT.CHAR.IDENT tests read the QIF fixtures with the project's hardened XML reader
# (IO.QIF.XML.PARSE, same services layer) to build the identity view of an element.
fid-xml = { path = "../fid-xml" }

[lints]
workspace = true
