[package]
name = "fid-project-cmd"
description = "Metrology Maven project commands on the bus: container create handlers and their registry definitions, the element tree state view, the stage commands and the stage value reads (spec nodes CORE.PRJ.CONT.HIER, CORE.PRJ.TREE.MODEL, CORE.PRJ.STAGE.MODEL, CORE.PRJ.STAGE.SWITCH)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Handler contract, state view, events, typed bus errors and principals (CORE.BUS). Layer
# engine, the same layer as this crate; it brings fid-store's bundled SQLite, which is why
# the handlers live here and not in fid-project (model).
fid-bus = { path = "../fid-bus" }
# Canonical JSON values for parameters and schemas (CORE.JRN.CANON). Layer model.
fid-canon = { path = "../fid-canon" }
# Journal session headers, checkpoints, chain verification and borrowed-store appends
# (CORE.PRJ.CONT.LIFE). Layer model, below fid-project-cmd (engine).
fid-journal = { path = "../fid-journal", features = ["store"] }
# Container types, the hierarchy checks and the ID service (CORE.PRJ.CONT.HIER, .ID, .LIFE). Layer model.
fid-project = { path = "../fid-project" }
# The four commands' registry definitions (CORE.REG.DEF). Layer model.
fid-registry = { path = "../fid-registry" }
# CORE.PRJ.STAGE.SWITCH: the blob store and evictable cache behind the value reads
# (CORE.STO.CAS, CORE.STO.CACHE). Layer model; already linked through fid-bus.
fid-store = { path = "../fid-store" }
# `sha256:` digests and command names (AGENTS.md rule 14). Layer num.
fid-types = { path = "../fid-types" }

[lints]
workspace = true
