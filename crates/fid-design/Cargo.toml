[package]
name = "fid-design"
description = "Design-system tooling commands: pkg-check and pkg-diff (UX.SYSTEM.PKG), princ-check and words-check (UX.SYSTEM.PRINC), review-check (UX.SYSTEM.REVIEW), screens-check and screens-gate (UX.SCREENS.INV), tokens-check (UX.TOKENS.COLOR), status-check (UX.TOKENS.STATUS), palettes-check (UX.TOKENS.DATAPAL), color-check (UX.TOKENS.CHECK), icons-prov and icons-registry (UX.ICONS.PROV), space-check (UX.TOKENS.SPACE), fonts-check (UX.TOKENS.TYPE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fid-design"
path = "src/main.rs"

[dependencies]
# The package reader (same layer).
fid-design-pkg = { path = "../fid-design-pkg" }
# RFC 8785 canonical JSON for the --json reports.
fid-canon = { path = "../fid-canon" }
# `sha256:` digests of approved artefacts (shared types).
fid-types = { path = "../fid-types" }
# The review path map `review/paths.toml` (already in the workspace; rejects duplicate keys).
toml = { version = "0.8", default-features = false, features = ["parse"] }
# NFC check and NFKC folding of untrusted text (already in the workspace).
unicode-normalization = "0.1.24"

[lints]
workspace = true
