[package]
name = "fid-registry"
description = "Metrology Maven command registry: definition records, the FPL precondition language and lifecycle records, task guides, the schema keyword vocabulary and quantity-catalogue facade, declaration validation and the compatibility classifier (spec nodes CORE.REG.DEF.FIELD, CORE.REG.DEF.PRED, CORE.REG.DEF.GUIDE, CORE.REG.VER.LIFE, CORE.REG.VER.COMPAT, CORE.REG.VAL, CORE.REG.DEF.SCHEMA), the canonical manifest export with `registry.show_manifest@1` (CORE.REG.MAN), and the declaration-macro runtime (CORE.REG.DEF.MACRO)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fid-canon = { path = "../fid-canon" }
fid-geo-frame = { path = "../fid-geo-frame" }
fid-kci = { path = "../fid-kci" }
# Declaration macros (CORE.REG.DEF.MACRO), re-exported from `decl`.
fid-registry-macros = { path = "../fid-registry-macros" }
fid-types = { path = "../fid-types" }

[lints]
workspace = true
