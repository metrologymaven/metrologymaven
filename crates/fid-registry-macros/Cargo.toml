[package]
name = "fid-registry-macros"
description = "Metrology Maven command declaration macros: #[derive(FidSchema)], #[fid_command(...)] and fid_commands![...] (spec node CORE.REG.DEF.MACRO); runtime support lives in fid-registry::decl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
