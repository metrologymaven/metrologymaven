[package]
name = "fid-surface-gen"
description = "Metrology Maven surface generator framework: the SurfaceEmitter trait, do-not-edit headers with the manifest digest, per-surface command indexes and deterministic atomic writes behind `cargo xtask gen-surfaces` (spec node AUTO.SURF.GEN)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `cargo xtask gen-surfaces` runs this binary: a `tool` crate may not be linked by another crate.
[[bin]]
name = "fid-surface-gen"
path = "src/main.rs"

# Build-time tool (layer `tool`): no other crate may link it (ECO.REPO.LAYERS); `cargo xtask
# gen-surfaces` runs its binary with `cargo run -p fid-surface-gen`.
[dependencies]
# RFC 8785 writer and reader for `surface-index.json` (model layer).
fid-canon = { path = "../fid-canon" }
# The command-surface projection every emitter consumes (AUTO.SURF.PROJ, services layer).
fid-surface = { path = "../fid-surface" }
# Shared command ID and `sha256:` digest types.
fid-types = { path = "../fid-types" }
# The MCP emitter (AUTO.MCP.PROJ, services layer), registered in `registered()`.
fid-mcp = { path = "../fid-mcp" }

[lints]
workspace = true
