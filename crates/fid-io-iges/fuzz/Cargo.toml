# cargo-fuzz harness for fid-io-iges (IO.CAD.IGES.SECT AC-6). Not a workspace member: it
# needs nightly and libFuzzer. Run from crates/fid-io-iges:
#   cargo +nightly fuzz run iges_parse -- -max_total_time=300
[package]
name = "fid-io-iges-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fid-io-iges = { path = ".." }

[[bin]]
name = "iges_parse"
path = "fuzz_targets/iges_parse.rs"
test = false
doc = false
bench = false

# Keep this crate out of the parent workspace.
[workspace]
members = ["."]
