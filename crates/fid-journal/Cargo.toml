[package]
name = "fid-journal"
description = "Metrology Maven semantic journal: entry model and salted commitments, atomic durable append, branch heads and checkpoints, chain verification and entry listing, named branches, branch diff, branch promotion, stream routing and the P0 Activity Log (spec nodes CORE.JRN.ENTRY, CORE.JRN.CHAIN.APPEND, CORE.JRN.CHAIN.CKPT, CORE.JRN.CHAIN.VERIFY, CORE.JRN.BR.NAME, CORE.JRN.BR.DIFF, CORE.JRN.BR.PROMO, CORE.JRN.STREAM.ALOG)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# CORE.JRN.CHAIN.APPEND: the `append` module, which writes through fid-store (SQLite and the
# blob store). Off by default so the entry model stays free of storage for its pure users
# (fid-replay and friends, which are also built for wasm32-wasip1).
store = ["dep:fid-store", "dep:fid-registry"]
# Test seam `Journal::set_fault_hook` (crash and fault injection, AC-2). Off by default;
# enabled only through the dev-dependency below, never in shipped builds.
test-hooks = ["store"]

[dependencies]
fid-canon = { path = "../fid-canon" }
fid-kci = { path = "../fid-kci" }
fid-types = { path = "../fid-types" }
getrandom = "0.2"
# Project database and blob store (CORE.STO.SQL, CORE.STO.CAS), same layer (model). fid-store
# is the only storage writer (storage-writers.toml); this crate reaches SQLite only through it.
fid-store = { path = "../fid-store", optional = true }
# CORE.JRN.CHAIN.VERIFY declares `journal.verify_chain@1` and `journal.list_entries@1`, and
# CORE.JRN.BR.NAME the four branch commands and CORE.JRN.BR.DIFF `journal.diff_branch@1`, as
# registry definitions (CORE.REG.DEF), with the store feature. Layer model, the same as this crate; already in the graph of every store user
# (fid-bus).
fid-registry = { path = "../fid-registry", optional = true }

[dev-dependencies]
# Integration tests use the append module and its fault hook.
fid-journal = { path = ".", features = ["store", "test-hooks"] }

[lints]
workspace = true
