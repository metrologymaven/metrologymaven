[package]
name = "fid-hal-runtime"
description = "Metrology Maven device runtime and acquisition manager: deterministic encoding conversion, clock time mapping, the device registry of serving sources and the ingest credit ledger (spec node HAL.ACQ)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# EncodingDescriptor, NumericType and SiUnit (spec node HAL.IDL.UNITS).
fid-hal-idl = { path = "../fid-hal-idl" }
# Correctly rounded sqrt through the KNP-1 facade (HAL.ACQ.TIME determinism, D0).
fid-num = { path = "../fid-num" }
# HAL.ACQ.SESS.REG: canonical JSON values for the listing and events (CORE.JRN.CANON), the
# registry definition of `device.show_devices@1` (CORE.REG.DEF), the `sha256:` file digest
# (AGENTS.md rule 14) and UUIDv5 for file-source IDs. All model layer or lower, already
# dependencies of fid-hal-idl or fid-mig; no SQLite and no new crate in the lock.
fid-canon = { path = "../fid-canon" }
fid-registry = { path = "../fid-registry" }
fid-types = { path = "../fid-types" }
fid-uuid = { path = "../fid-uuid" }

# Test-only: golden SHA-256 digests (layer test-support).
[dev-dependencies]
fid-testkit = { path = "../fid-testkit" }
# Test-only: the command's schemas are checked with the bus's own validator
# (`fid_bus::validate::Compiled`). Engine layer, as this crate; already in the lock.
fid-bus = { path = "../fid-bus" }

[lints]
workspace = true
