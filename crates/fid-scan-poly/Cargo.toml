[package]
name = "fid-scan-poly"
description = "Metrology Maven cloud polygonization kernel: vertex-set preparation, tangent-plane Delaunay fans and their stitching into a mesh, and overlap detection between registered scans (SCAN.POLY.SURF.PREP, FAN, STITCH; SCAN.POLY.MULTI.OVLP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Kernel crate (KNP-1): no third-party dependencies. Only kernel-layer workspace crates:
# fid-geo-types (the GEO.TYPES PointCloud with its normals and bounding box, and the Mesh that
# SCAN.POLY.SURF.STITCH builds), fid-geo-index
# (the GEO.INDEX.KDTREE radius query for the 2h neighbourhoods and its pinned squared
# distance) and fid-num (the KRN.NUM.LA.EIG symmetric eigensolver, `sqrt`, `cos` and the
# total-order maximum), and fid-fit for the exact-sign orient2d/incircle predicates of
# KRN.MZ.VOR (SCAN.POLY.SURF.FAN; the only implementation until KRN.NUM.PRED exists).
# SCAN.POLY.MULTI.OVLP adds no dependency (fid-geo-index radius queries, GEO.TYPES clouds).
[dependencies]
fid-fit = { path = "../fid-fit" }
fid-geo-index = { path = "../fid-geo-index" }
fid-geo-types = { path = "../fid-geo-types" }
fid-num = { path = "../fid-num" }

[dev-dependencies]
# Test-support only (never in the kernel graph): the workspace root for fixture paths.
fid-testkit = { path = "../fid-testkit" }

[lints]
workspace = true
