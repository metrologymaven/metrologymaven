[package]
name = "fid-io-step"
description = "Metrology Maven bounded ISO 10303-21 (clear-text STEP) exchange-structure parser and printer, STEP header and unit-context resolution, and STEP curve and surface mapping (spec nodes IO.CAD.STEP.P21, IO.CAD.STEP.HDR, IO.CAD.STEP.GEOM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The reader harness: Budget, BoundedSource, IoError, UntrustedText (IO.REG.LIMITS).
fid-io-reg = { path = "../fid-io-reg" }
# IO.CAD.STEP.GEOM: the GEO analytic and NURBS types the geometry maps to, and their evaluators
# (GEO.NURBS, kernel layer), and the pinned square root (KRN.NUM, num layer). Both workspace
# crates, zero third-party dependencies.
fid-geo-nurbs = { path = "../fid-geo-nurbs" }
fid-num = { path = "../fid-num" }

[dev-dependencies]
# IO.CAD.STEP.HDR tests build a real SourceProvenance, whose principal draft holds a CValue.
# Already in the tree through fid-io-reg.
fid-canon = { path = "../fid-canon" }

[lints]
workspace = true
