# cargo-fuzz harness for fid-io-step (IO.CAD.STEP.P21 AC-6). Not a workspace member: it
# needs nightly and libFuzzer. Run from crates/fid-io-step:
#   cargo +nightly fuzz run p21_parse -- -max_total_time=300
[package]
name = "fid-io-step-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fid-io-step = { path = ".." }

[[bin]]
name = "p21_parse"
path = "fuzz_targets/p21_parse.rs"
test = false
doc = false
bench = false

# Keep this crate out of the parent workspace.
[workspace]
members = ["."]
