[package]
name = "fid-pkg"
description = "Metrology Maven Result Package format: container layout, manifest and in-toto statement (spec node TRUST.PKG.MANIFEST), and the bounded package reader with verify.inspect_package (TRUST.PKG.READER)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fid-canon = { path = "../fid-canon" }
# Declares verify.inspect_package@1 with the registry macros (CORE.REG.DEF.MACRO). Layer model.
fid-registry = { path = "../fid-registry" }
fid-types = { path = "../fid-types" }
# Streaming SHA-256 of members (fid-canon only hashes whole buffers); already in the tree.
sha2 = "0.10"
# The Unicode NFC check of member paths (REQ-TRUST.PKG.MANIFEST-006) needs the
# composition tables; MIT OR Apache-2.0.
unicode-normalization = "0.1.24"

[lints]
workspace = true
