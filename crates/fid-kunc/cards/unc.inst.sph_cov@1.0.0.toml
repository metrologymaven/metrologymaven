# Spec card (UNC.INST.PORT.SPH). Cite designators and clause numbers only; never paste standards text.
id = "unc.inst.sph_cov@1.0.0"
title = "Spherical observation covariance"
method = "For a range r and angles az, el with x = r cos(el) cos(az), y = r cos(el) sin(az), z = r sin(el), returns J C J^T in m^2: J is the closed-form Jacobian of that map, C the declared covariance of (r, az, el) with sigma_r = sigma_r0 + sigma_r1 r and correlations rho_r_az, rho_r_el, rho_az_el. sin and cos through fid-num f; every product and sum rounded once in a fixed order (no FMA); only the upper triangle is computed and mirrored, so the result is exactly symmetric; -0 is written as +0. The three correlations must form a positive semi-definite matrix: the determinant 1 - a^2 - b^2 - c^2 + 2abc, evaluated in a fixed order, below -2^-47 (its rounding bound) is refused, within 2^-47 of zero is accepted and reported as singular_within_rounding."
applicability = "Laser trackers and total stations whose observation model declares a range uncertainty with a constant and a range-proportional part, two angle uncertainties and optional correlations, with angles in the elevation convention above (drivers convert zenith angles first). The stated accuracy (1e-14 relative in Frobenius norm) is validated for 0.1 m <= r <= 100 m, |el| <= 1.5 rad and |az| <= 2 pi with the largest entry at least 2^-962; outside, the result carries a domain note. The inputs are declared model values, so the covariance is derived, not measured."
references = [
  "JCGM 100:2008, clause 5.2 (combined standard uncertainty of correlated input quantities, law of propagation) [unverified: clause numbering]",
  "JCGM 102:2011 (extension to any number of output quantities; matrix form of the propagation) [unverified: clause numbering]",
]
determinism = "D0"
input_arity = "4"
failure_modes = [
  "A NaN or infinite sigma or correlation returns invalid_parameter{name, not_finite}; a negative sigma returns invalid_parameter{name, negative}; |rho| > 1 returns invalid_parameter{name, out_of_range}.",
  "Three correlations that cannot hold at once (determinant below -2^-47, for example 0.9, 0.9 and -0.9) return invalid_parameter{correlation, not_positive_semidefinite}.",
  "A NaN or infinite r, az or el returns invalid_observation{name, not_finite}; r < 0 returns invalid_observation{r, negative}.",
  "An entry that overflows to infinity returns numeric with the fid-num error.",
  "Outside the validated domain, or with every entry zero, the covariance is returned with the notes range_outside, elevation_outside, azimuth_outside, zero_covariance or scale_below_validated; the accuracy bound is not claimed there.",
]
validation = "Reproduces the 200 seeded cases of fixtures/unc/inst/port/sph_cases.json (seed 0x535048) within 1e-14 relative Frobenius norm of the 50-digit decimal reference, the axis-aligned case (az = el = 0, r = 10 m) within 2 ulp per diagonal entry with exact +0 off the diagonal, and the bit patterns predicted by the independent Python model of the documented order on x86-64, ARM64 and wasm32."
