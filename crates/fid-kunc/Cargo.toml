[package]
name = "fid-kunc"
description = "Metrology Maven kernel uncertainty types: evidence classes UEC-0..3 and the validated uncertainty statement with its canonical JSON and digest (spec node UNC.UEC.STMT), evidence class assignment uec-assign@1 (UNC.UEC.CLASS), input distributions and correlation (UNC.MODEL.DIST), the Uncertainty Model graph types, canonical form and digest (UNC.MODEL.GRAPH.SCHEMA) and its structural validation (UNC.MODEL.GRAPH.CHECK), Monte Carlo trial blocks through the kernel call interface (UNC.PROP.MCM.BLOCK), coverage intervals from samples (UNC.PROP.MCM.INTVL), the adaptive Monte Carlo stopping rule mcm-adapt@1 (UNC.PROP.MCM.ADAPT), retained sample sets mcm-samples@1 (UNC.PROP.MCM.SAMP), validation of LPU against Monte Carlo unc.prop.validate_lpu@1.0.0 (UNC.PROP.VALID) the operator tangent contract, tangent table and tangent-coverage@1 report (UNC.PROP.LPU.TAN) and the feature covariance type with the fcov-param@1 parameterisations (UNC.PROP.MVAR.PARAM), the joint Monte Carlo sample covariance and coverage region of a characteristic group (UNC.PROP.MVAR.VMCM), contributor ranking unc.prop.rank@1.0.0 (UNC.PROP.RANK) and the spherical observation covariance unc.inst.sph_cov@1.0.0 (UNC.INST.PORT.SPH)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Kernel crate (KNP-1): no third-party dependencies; only fid-types (layer num, `sha256:`
# digests), fid-kci (layer kernel, the shared RFC 8785 writer and the portable SHA-256),
# fid-num (layer num: transcendentals, reductions, the counter RNG and the pivoted Cholesky
# used by the `dist` module, UNC.MODEL.DIST) and fid-fit (layer kernel: the kernel's
# `FittedFeature` and its canonical form, which `prop::mvar::param` converts to and from the
# fcov-param@1 vector, UNC.PROP.MVAR.PARAM).
[dependencies]
fid-types = { path = "../fid-types" }
fid-kci = { path = "../fid-kci" }
fid-num = { path = "../fid-num" }
fid-fit = { path = "../fid-fit" }

# `tangent-harness`: the test-only central-difference harness of UNC.PROP.LPU.TAN
# (REQ-UNC.PROP.LPU.TAN-005). Only dev-dependencies enable it; the engine never differentiates
# numerically (REQ-003).
[features]
tangent-harness = []

[dev-dependencies]
fid-kunc = { path = ".", features = ["tangent-harness"] }

[lints]
workspace = true
