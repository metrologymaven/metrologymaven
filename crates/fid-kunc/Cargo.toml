[package]
name = "fid-kunc"
description = "Metrology Maven kernel uncertainty types: evidence classes UEC-0..3 and the validated uncertainty statement with its canonical JSON and digest (spec node UNC.UEC.STMT), evidence class assignment uec-assign@1 (UNC.UEC.CLASS), and input distributions and correlation (UNC.MODEL.DIST)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Kernel crate (KNP-1): no third-party dependencies; only fid-types (layer num, `sha256:`
# digests), fid-kci (layer kernel, the shared RFC 8785 writer and the portable SHA-256) and
# fid-num (layer num: transcendentals, reductions, the counter RNG and the pivoted Cholesky
# used by the `dist` module, UNC.MODEL.DIST).
[dependencies]
fid-types = { path = "../fid-types" }
fid-kci = { path = "../fid-kci" }
fid-num = { path = "../fid-num" }

[lints]
workspace = true
