[package]
name = "fid-overlay"
description = "Metrology Maven viewer overlays: status markers, the locked status-palette guard, provenance badges, out-of-tolerance pattern definitions, and the LabelSet entity with view label commands (VIZ.OVERLAY.STATUS, VIZ.OVERLAY.LABEL.MODEL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Viewer layer. No GPU, windowing or UI-toolkit crate: pure presentation models and commands.
[dependencies]
# The display status a scene node carries (VIZ.RENDER.SCENE.PROJ, same layer) and the kernel
# outcome inside it (UNC.DEC, kernel layer).
fid-render = { path = "../fid-render" }
fid-kdec = { path = "../fid-kdec" }
# RFC 8785 canonical JSON and SHA-256 (CORE.JRN.CANON, model layer).
fid-canon = { path = "../fid-canon" }
# Shared vocabulary types: Digest, SideEffect, Determinism, text validation (num layer).
fid-types = { path = "../fid-types" }
# Workspace UUID value type for LabelSetId, LabelId and ElementRef (model layer).
fid-uuid = { path = "../fid-uuid" }
# Element tree and replayable ID service (CORE.PRJ.TREE.MODEL, model layer).
fid-project = { path = "../fid-project" }
# Registry command definitions for view.{add,edit,remove}_label@1 (CORE.REG.DEF, model layer).
fid-registry = { path = "../fid-registry" }

[dev-dependencies]
# D-045: the tests feed `fid_gdt::requires_provisional_label_bytes` into the item builder and
# check the label constants. Test-only, so the viewer's runtime graph stays free of fid-gdt.
fid-gdt = { path = "../fid-gdt" }
# AC-5 exact replay classification (IDENTICAL) over recorded label commands. Test-only.
fid-replay = { path = "../fid-replay" }

[lints]
workspace = true
