[package]
name = "fid-report"
description = "Metrology Maven report model: report document, pages, blocks, block-kind registry, report commands and value formatting (spec nodes RPT.MODEL.DOC, RPT.MODEL.FMT, RPT.MODEL.BIND.RESOLVE, RPT.MODEL.BIND.EXPAND, RPT.MODEL.TMPL.VER)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# RFC 8785 canonical JSON, bounded parsing and SHA-256 of stored reports and events (CORE.JRN.CANON).
fid-canon = { path = "../fid-canon" }
# UUIDv7 construction and the observation sources that record or replay its clock and random
# bits (CORE.PRJ.CONT.ID); also re-exports the Uuid value type. Layer model.
fid-project = { path = "../fid-project" }
# Evaluation basis of a ResultRecord (GDT.CHAR.RECORD), for the source labels of
# RPT.MODEL.FMT. Layer services.
fid-gdt = { path = "../fid-gdt" }
# Transcription record (IO.RES.TRANS.MODEL): source software and version of a RESULTS_ONLY
# value. Layer services.
fid-io-res = { path = "../fid-io-res" }
# Decision record, outcome and rule IDs (UNC.DEC.TYPE). Layer kernel.
fid-kdec = { path = "../fid-kdec" }
# Uncertainty statement, evidence class and claim facts (UNC.UEC). Layer kernel.
fid-kunc = { path = "../fid-kunc" }
# Kernel formatters fmt.length@1, fmt.angle@1, fmt.scalar@1 and exact decimals
# (KRN.NUM.FMT, KRN.NUM.KDEC): the only float-to-text code RPT uses. Layer num.
fid-num = { path = "../fid-num" }
# CommandDef records for the six report commands, built through the registry's field rules
# (CORE.REG). Layer model.
fid-registry = { path = "../fid-registry" }
# Replay outcome classes (CORE.RPL.CLASS) for the exact-replay check (AC-7). Layer engine.
fid-replay = { path = "../fid-replay" }
# Shared `sha256:` digest type (AGENTS.md rule 14). Layer num.
fid-types = { path = "../fid-types" }
# Approved import roots (IO.REG.ROOTS): template files reach `report.save_template@1` only
# through `RootSet::resolve_import`, so an agent's raw path is `raw_path_forbidden`
# (RPT.MODEL.TMPL.VER REQ-007). Layer services; already in this crate's tree through
# fid-gdt and fid-io-res, so no new crate in the lock.
fid-io-reg = { path = "../fid-io-reg" }
# Bounded 2D drawing reader for PDF page structure, PNG and TIFF (IO.REG.PLUGIN.DRAW):
# used by RPT.BALLOON.SHEET.IMPORT without parsing PDF or images inside RPT. Layer services.
fid-io-draw = { path = "../fid-io-draw" }
# Content-addressed blob store (CORE.STO.CAS): stores imported drawing source bytes and
# decoded raster blobs by SHA-256 digest (RPT.BALLOON.SHEET.IMPORT). Layer model; already in
# this crate's transitive tree through fid-io-reg.
fid-store = { path = "../fid-store" }
# Authored-literal unit normalisation (CORE.BUS.UNIT) and schema validation: engine layer,
# below services; already in this crate's tree through fid-gdt.
fid-bus = { path = "../fid-bus" }

[features]
# Test-only block kinds `text` and `image` (module `doc::stub`), and `table` with its resolver
# (module `bind::stub`). Off by default; enabled only
# through the dev-dependency below, never in shipped builds. Real kinds are registered by
# RPT.MODEL.BLOCKS, RPT.BALLOON and RPT.FORMS.
test-kinds = []
# Test-only hook `fmt::fmt_value_with` that takes another formatter (a stub or a coarse pi
# ladder) for RPT.MODEL.FMT AC-3. Off by default; enabled only through the dev-dependency.
test-formatter = []
# Test-only hook `fmt::InterpretationStatus::test_of_record_bytes` that reads a status from
# hand-made record bytes (RPT.MODEL.FMT AC-12). Off by default; enabled only through the
# dev-dependency. Shipped builds read a status only from BIND's journaled records.
test-interpretation = []

[dev-dependencies]
fid-report = { path = ".", features = ["test-kinds", "test-formatter", "test-interpretation"] }

[lints]
workspace = true
