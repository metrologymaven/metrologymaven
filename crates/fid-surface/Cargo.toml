[package]
name = "fid-surface"
description = "Metrology Maven shared result envelope and error codes for CLI and MCP, and the surface projection model, the invocation tracker, the root-handle gate, and the in-process bus transport (spec nodes AUTO.SURF.ENV, AUTO.SURF.PROJ, AUTO.SURF.JOBS, AUTO.SURF.ROOTS, AUTO.SURF.INPROC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# AUTO.SURF.INPROC: the BusPort trait and ApiReply types the in-process transport wraps. Layer
# model, over fid-canon and fid-types only; never fid-bus, so this crate still builds for wasm32.
fid-bus-api = { path = "../fid-bus-api" }
fid-canon = { path = "../fid-canon" }
fid-types = { path = "../fid-types" }
# UUID value type for idempotency keys and job IDs (AUTO.SURF.JOBS). Layer model; only sha1.
fid-uuid = { path = "../fid-uuid" }

# AUTO.SURF.ROOTS: tests prove the surface gate and the bus guard CORE.BUS.POL.FS give the same
# verdict. Dev-only: a surface crate may not link the bus (CORE.BUS.LINT `surface_dep`), and
# fid-bus builds SQLite, so these are left out of the wasm32 test run.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
fid-bus = { path = "../fid-bus", features = ["test-support"] }
fid-journal = { path = "../fid-journal" }
fid-registry = { path = "../fid-registry" }

[lints]
workspace = true
