[package]
name = "fid-journal-cmd"
description = "Metrology Maven journal commands on the bus: handlers of journal.create_branch@1, journal.list_branches@1, journal.protect_branch@1, journal.set_branch_coediting@1 and journal.diff_branch@1 (spec nodes CORE.JRN.BR.NAME and CORE.JRN.BR.DIFF, bus half)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Handler contract, events, typed bus errors and principals (CORE.BUS). Layer engine, the same
# layer as this crate; fid-journal (model) may not depend on it, which is why the handlers live
# here, as fid-project-cmd does for fid-project.
fid-bus = { path = "../fid-bus" }
# Canonical JSON values (CORE.JRN.CANON). Layer model.
fid-canon = { path = "../fid-canon" }
# The branch table, its planners and the four registry definitions (CORE.JRN.BR.NAME); the branch
# diff and its definition (CORE.JRN.BR.DIFF). Layer model.
fid-journal = { path = "../fid-journal", features = ["store"] }
# Registry definitions (CORE.REG.DEF). Layer model.
fid-registry = { path = "../fid-registry" }
# The sha256: digest type. Layer num.
fid-types = { path = "../fid-types" }

[dev-dependencies]
# ValidParams::for_tests (handler tests outside fid-bus).
fid-bus = { path = "../fid-bus", features = ["test-support"] }

[lints]
workspace = true
