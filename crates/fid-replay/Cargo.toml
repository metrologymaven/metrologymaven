[package]
name = "fid-replay"
description = "Metrology Maven replay: outcome classification, first-divergence search and attribution (spec nodes CORE.RPL.CLASS, CORE.RPL.BISECT, CORE.RPL.EXEC.SUBST)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# CORE.RPL.RECON.SNAP: SQLite snapshot table and fid-store cache integration. Off by default so
# fid-replay stays wasm32-wasip1 compatible when built with default features.
store = ["dep:fid-store", "fid-journal/store"]

[dependencies]
fid-types = { path = "../fid-types" }
# Canonical JSON for the bisect report fragment and snapshot digests; fid-canon sits below
# fid-replay in layers.toml.
fid-canon = { path = "../fid-canon" }
# CORE.RPL.EXEC.SUBST & CORE.RPL.RECON.SNAP: commitment salts, Activity Log, and command
# reachability. Both sit below fid-replay in layers.toml (model < engine).
fid-journal = { path = "../fid-journal" }
fid-registry = { path = "../fid-registry" }
# CORE.RPL.RECON.SNAP: optional project database and evictable cache store (layer model < engine).
fid-store = { path = "../fid-store", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
fid-replay = { path = ".", features = ["store"] }
fid-store = { path = "../fid-store" }

[lints]
workspace = true
