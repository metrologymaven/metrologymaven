[package]
name = "fid-jobs"
description = "Metrology Maven jobs: progress and cancellation (CORE.JOB.PROG), job scheduler with queue, priorities, limits and timeouts (CORE.JOB.SCHED), job commands and the job-status contract (CORE.JOB.CMD), the Activity Log lifecycle sink (CORE.JRN.STREAM.ALOG)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Typed bus errors (`not_found/unknown_job`, `policy/not_job_owner`, ...) for the job
# commands (CORE.JOB.CMD). Same layer (engine); fid-bus does not depend on fid-jobs.
fid-bus = { path = "../fid-bus" }
# Canonical JSON for job-status results and bounded parameter parsing. Layer model.
fid-canon = { path = "../fid-canon" }
# CommandDef records and the FPL evaluator for the cancel precondition. Layer model.
fid-registry = { path = "../fid-registry" }
# The Activity Log (CORE.JRN.STREAM.ALOG): `activity` implements `LifecycleSink` for
# `fid_journal::stream::ActivityLog`. Layer model, below fid-jobs; default features only (no
# SQLite). The impl lives here because fid-journal (model) cannot depend on fid-jobs (engine).
fid-journal = { path = "../fid-journal" }
# Shared command IDs (AGENTS.md rule 14). Layer num, below fid-jobs (engine).
fid-types = { path = "../fid-types" }
# UUID value type for job IDs (UUIDv7 built here). Layer model, below fid-jobs.
fid-uuid = { path = "../fid-uuid" }

[lints]
workspace = true
