[package]
name = "fid-registry-build"
description = "Metrology Maven registry build step: collects every crate's command declarations, validates them and exports the canonical Registry Manifest (spec node CORE.REG.MAN)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Canonical JSON for the error report. Layer model.
fid-canon = { path = "../fid-canon" }
# The manifest export, VAL and the quantity-catalogue facade (CORE.REG.MAN, CORE.REG.VAL,
# CORE.REG.DEF.SCHEMA), and `registry.show_manifest@1` itself. Layer model.
fid-registry = { path = "../fid-registry" }
# The crates that declare commands today, read through their public `command_defs()`
# functions. Layers engine (fid-align, fid-dep, fid-jobs, fid-project-cmd) and services (fid-report).
fid-align = { path = "../fid-align" }
fid-dep = { path = "../fid-dep" }
# `sign.list_meanings@1` (TRUST.ESIG.MEANING), read through `fid_esig::command_defs()`. Layer engine.
fid-esig = { path = "../fid-esig" }
# `geo.describe_element@1` (GEO.TYPES.REG), read through `fid_geo_cmd::command_defs()`.
# Layer engine.
fid-geo-cmd = { path = "../fid-geo-cmd" }
# `device.show_devices@1` (HAL.ACQ.SESS.REG), read through
# `fid_hal_runtime::registry::command_defs()`. Layer engine; already in the lock.
fid-hal-runtime = { path = "../fid-hal-runtime" }
fid-jobs = { path = "../fid-jobs" }
# `sign.set_profile@1` and `sign.show_profile@1` (TRUST.PROFILE.SELECT), read through
# `fid_profile_cmd::command_defs()`. Layer engine.
fid-profile-cmd = { path = "../fid-profile-cmd" }
fid-project-cmd = { path = "../fid-project-cmd" }
fid-report = { path = "../fid-report" }
# `mesh.invert_normals@1` (SCAN.MESHOP.CUT.INVERT), read through
# `fid_scan_mesh_cmd::command_defs()`. Layer engine.
fid-scan-mesh-cmd = { path = "../fid-scan-mesh-cmd" }
# `program.check@1` (AUTO.PROG.CHECK), read through `fid_program::command_defs()`. Layer
# services, as this crate; already in the lock.
fid-program = { path = "../fid-program" }
# The adoption commands of AUTO.REC.ADOPT and the lifecycle commands of AUTO.REC.LIFE, read
# through `fid_program_rec::{adopt,life}::declarations()`.
# Layer services, as this crate.
fid-program-rec = { path = "../fid-program-rec" }
# The settings commands (CORE.STO.SET), read through `fid_store::settings::declarations()`.
# Layer model. Brings bundled SQLite into this build step; no new crate in the lock.
fid-store = { path = "../fid-store" }
# The model commands of UNC.MODEL.GRAPH.STORE (unc.create_model@1, unc.validate_model@1,
# unc.show_model@1), read through `fid_unc::model_store::declarations()`. Layer engine.
fid-unc = { path = "../fid-unc" }
# The instrument-model commands of UNC.INST.SCHEMA (unc.import_instrument_model@1,
# unc.show_instrument_model@1, unc.bind_instrument_model@1), `fid_unc_inst::command_defs`.
# Layer engine.
fid-unc-inst = { path = "../fid-unc-inst" }
# The settings each crate declares with `fid_settings!` (CORE.STO.SET), collected into the
# workspace settings manifest: `fid_bus::policy::fs::fs_settings` (`bus.fs_roots`); and the
# request commands of CORE.BUS.POL.PROJ (`fid_bus::policy::projection::command_defs`). Layer
# engine, below services; already in the lock.
fid-bus = { path = "../fid-bus" }
# `fid_catalog::catalog_settings` (`stats.catalog_path`, RPT.CATALOG.STORE.SCHEMA), collected into
# the workspace settings manifest. Layer services, as this crate; adds no crate outside the lock.
fid-catalog = { path = "../fid-catalog" }
# `fid_journal::stream::activity_settings` (the Activity Log rotation size and kept files,
# CORE.JRN.STREAM.ALOG), the branch commands `fid_journal::branch::command_defs`
# (CORE.JRN.BR.NAME) and the branch diff `fid_journal::diff::command_defs` (CORE.JRN.BR.DIFF). Feature `store` because the declaration uses fid-store's macro. Layer
# model; already in the lock.
fid-journal = { path = "../fid-journal", features = ["store"] }
# `migrate.list_sources@1` (MIG.SRC.REG) and `migrate.generate_coverage@1` (MIG.COVER.GEN),
# `fid_mig::command_defs`. Layer services.
fid-mig = { path = "../fid-mig" }
# `rdl.check_suite@1` (R1) and `rdl.list_suite@1` (R0) of UNC.ORS.TRACE. Layer services, the
# same layer as this crate; adds no crate outside the lock.
fid-ors = { path = "../fid-ors" }
# `validate.show_record@1` (R0) of QUAL.IQOQ.RECORD. Layer services, same layer as this crate.
fid-qual = { path = "../fid-qual" }

# `test_support::all_defs` (feature `test-support`) also lists the command definitions of
# crates not yet in SOURCES: GDT (record, status, datum), RDL, the package reader, the
# signature check (fid-sign-core, TRUST.SIGN.TROOT) and the export commands. Layers services and model; already in the lock. Only for tests: the
# bus-validation compile test (CORE.BUS.PIPE.VALID) and fid-mcp's registry walk.
fid-gdt = { path = "../fid-gdt", optional = true }
fid-io-reg = { path = "../fid-io-reg", optional = true }
fid-pkg = { path = "../fid-pkg", optional = true }
fid-sign-core = { path = "../fid-sign-core", optional = true }
fid-rdl = { path = "../fid-rdl", optional = true }

[features]
# `test_support::all_defs`: every declared command of the workspace. Only `[dev-dependencies]`
# enable it.
test-support = ["dep:fid-gdt", "dep:fid-io-reg", "dep:fid-pkg", "dep:fid-rdl", "dep:fid-sign-core"]

[dev-dependencies]
# Error values for the bus-catalogue mapping test of fid-geo-cmd's errors.
fid-geo-types = { path = "../fid-geo-types" }
fid-project = { path = "../fid-project" }
fid-uuid = { path = "../fid-uuid" }
# `test_support::all_defs` for this crate's bus-validation and surface-projection tests.
fid-registry-build = { path = ".", features = ["test-support"] }
# AUTO.SURF.PROJ over the workspace manifest (tests/surface_projection.rs). Layer services.
fid-surface = { path = "../fid-surface" }

[lints]
workspace = true
