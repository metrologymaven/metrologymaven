[package]
name = "fid-registry-build"
description = "Metrology Maven registry build step: collects every crate's command declarations, validates them and exports the canonical Registry Manifest (spec node CORE.REG.MAN)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Canonical JSON for the error report. Layer model.
fid-canon = { path = "../fid-canon" }
# The manifest export, VAL and the quantity-catalogue facade (CORE.REG.MAN, CORE.REG.VAL,
# CORE.REG.DEF.SCHEMA), and `registry.show_manifest@1` itself. Layer model.
fid-registry = { path = "../fid-registry" }
# The crates that declare commands today, read through their public `command_defs()`
# functions. Layers engine (fid-align, fid-dep, fid-jobs, fid-project-cmd) and services (fid-report).
fid-align = { path = "../fid-align" }
fid-dep = { path = "../fid-dep" }
# `geo.describe_element@1` (GEO.TYPES.REG), read through `fid_geo_cmd::command_defs()`.
# Layer engine.
fid-geo-cmd = { path = "../fid-geo-cmd" }
fid-jobs = { path = "../fid-jobs" }
fid-project-cmd = { path = "../fid-project-cmd" }
fid-report = { path = "../fid-report" }
# The adoption commands of AUTO.REC.ADOPT and the lifecycle commands of AUTO.REC.LIFE, read
# through `fid_program_rec::{adopt,life}::declarations()`.
# Layer services, as this crate.
fid-program-rec = { path = "../fid-program-rec" }
# The settings commands (CORE.STO.SET), read through `fid_store::settings::declarations()`.
# Layer model. Brings bundled SQLite into this build step; no new crate in the lock.
fid-store = { path = "../fid-store" }
# The model commands of UNC.MODEL.GRAPH.STORE (unc.create_model@1, unc.validate_model@1,
# unc.show_model@1), read through `fid_unc::model_store::declarations()`. Layer engine.
fid-unc = { path = "../fid-unc" }
# The settings each crate declares with `fid_settings!` (CORE.STO.SET), collected into the
# workspace settings manifest: `fid_bus::policy::fs::fs_settings` (`bus.fs_roots`); and the
# request commands of CORE.BUS.POL.PROJ (`fid_bus::policy::projection::command_defs`). Layer
# engine, below services; already in the lock.
fid-bus = { path = "../fid-bus" }
# `fid_journal::stream::activity_settings` (the Activity Log rotation size and kept files,
# CORE.JRN.STREAM.ALOG). Feature `store` because the declaration uses fid-store's macro. Layer
# model; already in the lock.
fid-journal = { path = "../fid-journal", features = ["store"] }

[dev-dependencies]
# Error values for the bus-catalogue mapping test of fid-geo-cmd's errors.
fid-geo-types = { path = "../fid-geo-types" }
fid-project = { path = "../fid-project" }
fid-uuid = { path = "../fid-uuid" }
# The bus-validation compile test (CORE.BUS.PIPE.VALID, re-review of #341) also compiles the
# command definitions of crates not yet in SOURCES: GDT (record, status, datum), RDL, the
# package reader and the export commands. Layers services and model; already in the lock.
fid-gdt = { path = "../fid-gdt" }
fid-io-reg = { path = "../fid-io-reg" }
fid-pkg = { path = "../fid-pkg" }
fid-rdl = { path = "../fid-rdl" }

[lints]
workspace = true
