[package]
name = "fid-xtask"
description = "Metrology Maven repository tasks: `cargo xtask layers` (ECO.REPO.LAYERS), `cargo xtask lint-crate-graph` (CORE.BUS.LINT), `cargo xtask kernel-allow` (ECO.REPO.ALLOW), `cargo xtask apps-policy` (ECO.APPS.POLICY), `cargo xtask plat-matrix lint-tiers` (PLAT.MATRIX.POLICY.DEFS), `cargo xtask plat-hw validate` (PLAT.HW.PROFILE), `cargo xtask plat-hw validate-suite|result-schema` (PLAT.HW.SCHEMA), `cargo xtask rel version-check|version-compare` (ECO.REL.PROC.VERSION), `cargo xtask rel sums` (ECO.REL.SIGN.SUMS), `cargo xtask rel runbook-check|runbook-render` (ECO.REL.PROC.RUNBOOK), `cargo xtask rel sbom` (ECO.REL.SIGN.SBOM), `cargo xtask rel keys-check` (ECO.REL.SIGN.GUIDE), `cargo xtask plat-deploy netlist` (PLAT.DEPLOY.OFFLINE.NETLIST), `cargo xtask plat-gpu validate` (PLAT.GPU.POLICY), `cargo xtask plat-deploy validate-layout` (PLAT.DEPLOY.NOADMIN.LAYOUT), `cargo xtask plat-deploy check-bundle|make-install-manifest|bundle-schemas` (PLAT.DEPLOY.OFFLINE.BUNDLE), `cargo xtask bots-check` (ECO.CI.BOTS.REG), `cargo xtask bot-blocking` (ECO.CI.BOTS.BLOCK), `cargo xtask conic-audit` (KRN.SOLV.CONIC.VEND), `cargo xtask mig ladder-check` (MIG.LADDER.DEF), `cargo xtask qual vap check-templates` (QUAL.VAP.TPL), `cargo xtask registry-gate` (CORE.REG.VER.GATE), `cargo xtask gen-surfaces` (AUTO.SURF.GEN, runs the fid-surface-gen binary), `cargo xtask crash-harness` (CORE.STO.SQL.CRASH, runs the fid-crash binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fid-xtask"
path = "src/main.rs"

[dependencies]
# `personas-check` (FLOW.PERSONA.PERS); fid-accept is an `app` crate, so a direct dependency is allowed.
fid-accept = { path = "../fid-accept" }
# Also bounded JSON parsing for bot configs and the review export (`bots-check`).
fid-canon = { path = "../fid-canon" }
# `mig ladder-check` (MIG.LADDER.DEF) and `mig sources-check` (MIG.SRC.REG): the ladder and
# source-register loaders and checks (services layer).
fid-mig = { path = "../fid-mig" }
# `qual vap check-templates` (QUAL.VAP.TPL): the vap-template/1 check and the intended-use
# catalogue loader live in fid-qual (services layer); this command is a thin wrapper.
fid-qual = { path = "../fid-qual" }
# `mig sources-check --vocab-rules` (MIG.SRC.REG vocabulary check): the project's one
# vocabulary and claim lint engine (ECO.RULES.VOCAB.ENGINE, app layer).
fid-vocab = { path = "../fid-vocab" }
# `registry-gate` (CORE.REG.VER.GATE): the manifest reader, the compatibility classifier
# (`compat::diff`) and the lifecycle check, the gate's only sources of truth (model layer).
fid-registry = { path = "../fid-registry" }
# `rel sums` (ECO.REL.SIGN.SUMS) and `plat-deploy netlist` (PLAT.DEPLOY.OFFLINE.NETLIST): shared
# side-effect class, command name and the `sha256:` digest type, and streaming SHA-256 over
# artefacts (the same sha2 0.10 that fid-canon already uses, so no new crate in the graph).
fid-types = { path = "../fid-types" }
# `rel sbom` (ECO.REL.SIGN.SBOM): UUIDv5 document namespaces (first-party, model layer).
fid-uuid = { path = "../fid-uuid" }
sha2 = "0.10"
# Parses Cargo.toml and repos.toml for `pins`, and bots.toml and TOML bot configs for `bots-check`
# as untyped tables (no serde derive; same feature set as fid-knp1-lint).
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
# tests/mig_sources_check.rs builds the workspace registry manifest the production source
# register is checked against (MIG.SRC.REG); services layer, already in the lock.
fid-registry-build = { path = "../fid-registry-build" }
# tests/unsafe_exception.rs (D-048 gate) tokenises every .rs file with the lexer under syn, so
# attributes are matched as token trees, across lines, never inside comments or strings.
# MIT OR Apache-2.0, already in the lock (fid-registry-macros); span-locations gives line numbers.
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints]
workspace = true
