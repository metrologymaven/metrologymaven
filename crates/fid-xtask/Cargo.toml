[package]
name = "fid-xtask"
description = "Metrology Maven repository tasks: `cargo xtask layers` (ECO.REPO.LAYERS), `cargo xtask lint-crate-graph` (CORE.BUS.LINT), `cargo xtask kernel-allow` (ECO.REPO.ALLOW), `cargo xtask apps-policy` (ECO.APPS.POLICY), `cargo xtask plat-matrix lint-tiers` (PLAT.MATRIX.POLICY.DEFS), `cargo xtask plat-hw validate` (PLAT.HW.PROFILE), `cargo xtask plat-hw validate-suite|result-schema` (PLAT.HW.SCHEMA), `cargo xtask rel version-check|version-compare` (ECO.REL.PROC.VERSION), `cargo xtask rel sums` (ECO.REL.SIGN.SUMS), `cargo xtask rel runbook-check|runbook-render` (ECO.REL.PROC.RUNBOOK), `cargo xtask rel sbom` (ECO.REL.SIGN.SBOM), `cargo xtask rel keys-check` (ECO.REL.SIGN.GUIDE), `cargo xtask plat-deploy netlist` (PLAT.DEPLOY.OFFLINE.NETLIST), `cargo xtask plat-gpu validate` (PLAT.GPU.POLICY), `cargo xtask plat-deploy validate-layout` (PLAT.DEPLOY.NOADMIN.LAYOUT), `cargo xtask plat-deploy check-bundle|make-install-manifest|bundle-schemas` (PLAT.DEPLOY.OFFLINE.BUNDLE), `cargo xtask bots-check` (ECO.CI.BOTS.REG), `cargo xtask bot-blocking` (ECO.CI.BOTS.BLOCK), `cargo xtask conic-audit` (KRN.SOLV.CONIC.VEND), `cargo xtask mig ladder-check` (MIG.LADDER.DEF), `cargo xtask registry-gate` (CORE.REG.VER.GATE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fid-xtask"
path = "src/main.rs"

[dependencies]
# `personas-check` (FLOW.PERSONA.PERS); fid-accept is an `app` crate, so a direct dependency is allowed.
fid-accept = { path = "../fid-accept" }
# Also bounded JSON parsing for bot configs and the review export (`bots-check`).
fid-canon = { path = "../fid-canon" }
# `mig ladder-check` (MIG.LADDER.DEF): the ladder loader and check (services layer).
fid-mig = { path = "../fid-mig" }
# `registry-gate` (CORE.REG.VER.GATE): the manifest reader, the compatibility classifier
# (`compat::diff`) and the lifecycle check, the gate's only sources of truth (model layer).
fid-registry = { path = "../fid-registry" }
# `rel sums` (ECO.REL.SIGN.SUMS) and `plat-deploy netlist` (PLAT.DEPLOY.OFFLINE.NETLIST): shared
# side-effect class, command name and the `sha256:` digest type, and streaming SHA-256 over
# artefacts (the same sha2 0.10 that fid-canon already uses, so no new crate in the graph).
fid-types = { path = "../fid-types" }
# `rel sbom` (ECO.REL.SIGN.SBOM): UUIDv5 document namespaces (first-party, model layer).
fid-uuid = { path = "../fid-uuid" }
sha2 = "0.10"
# Parses Cargo.toml and repos.toml for `pins`, and bots.toml and TOML bot configs for `bots-check`
# as untyped tables (no serde derive; same feature set as fid-knp1-lint).
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
