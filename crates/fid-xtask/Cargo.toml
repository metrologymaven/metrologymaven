[package]
name = "fid-xtask"
description = "Metrology Maven repository tasks: `cargo xtask layers` (ECO.REPO.LAYERS), `cargo xtask bots-check` (ECO.CI.BOTS.REG)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fid-xtask"
path = "src/main.rs"

[dependencies]
# Bounded JSON parsing for bot configs and the review export.
fid-canon = { path = "../fid-canon" }
# Reads bots.toml and TOML bot configs as untyped tables (no serde derive); already used by fid-knp1-lint.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
