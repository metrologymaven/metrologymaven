[package]
name = "fid-xtask"
description = "Metrology Maven repository tasks: `cargo xtask layers` (ECO.REPO.LAYERS), `cargo xtask lint-crate-graph` (CORE.BUS.LINT), `cargo xtask plat-matrix lint-tiers` (PLAT.MATRIX.POLICY.DEFS), `cargo xtask rel version-check|version-compare` (ECO.REL.PROC.VERSION)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fid-xtask"
path = "src/main.rs"

[dependencies]
# `personas-check` (FLOW.PERSONA.PERS); fid-accept is an `app` crate, so a direct dependency is allowed.
fid-accept = { path = "../fid-accept" }
fid-canon = { path = "../fid-canon" }
# Parses Cargo.toml and repos.toml for `pins` (same feature set as fid-knp1-lint).
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
