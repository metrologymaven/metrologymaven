[package]
name = "fid-geo-cad"
description = "Metrology Maven CAD boundary representation: B-rep arena, typed stable IDs, builder with topology checks, the canonical binary encoding with its SHA-256 digest, adjacency, coedge pcurves, trimmed-face classification, defect validation without repair, assembly instances with per-instance entity IDs, and shared edge discretisation for tessellation, and nominal elements mapped directly from analytic faces, edges and vertices (spec nodes GEO.CAD.TOPO.MODEL, ADJ, PCURVE, TRIM, VALID, GEO.CAD.ASSY.MODEL, GEO.CAD.TESS.EDGE, GEO.CAD.NOMINAL.DIRECT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Kernel crate (KNP-1): no third-party dependencies. Only workspace crates of the num and
# kernel layers: fid-geo-nurbs (the NURBS and analytic curve and surface types the faces and
# edges hold), fid-num (num layer: the KNP-1 `hypot` for pcurve deviations), fid-kci (its
# portable FIPS 180-4 SHA-256 for the body digest and the encoding trailer) and fid-types (the shared `sha256:` Digest wire form). UUIDv5 needs SHA-1, which
# no kernel crate offers and fid-uuid (model layer, RustCrypto `sha1`) cannot provide to a
# kernel crate, so a private FIPS 180-4 SHA-1 lives in `topo::uuid`. fid-geo-frame (kernel
# layer, KNP-1) gives the FrameId and FrameTree an assembly instance is placed in
# (GEO.CAD.ASSY.MODEL).
[dependencies]
fid-geo-frame = { path = "../fid-geo-frame" }
fid-geo-nurbs = { path = "../fid-geo-nurbs" }
fid-num = { path = "../fid-num" }
fid-kci = { path = "../fid-kci" }
fid-types = { path = "../fid-types" }

[lints]
workspace = true
