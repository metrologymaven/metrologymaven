# Crate layer map (spec node ECO.REPO.LAYERS). A crate may depend only on crates
# in its own or lower layers; `cargo xtask layers` checks it in CI.
order = ["num", "kernel", "model", "engine", "services", "viewer", "app", "tool"]

[crates]
"fid-num" = "num"
"fid-types" = "num"
"fid-kci" = "kernel"
"fid-geo-nurbs" = "kernel"
"fid-geo-types" = "kernel"
"fid-canon" = "model"
"fid-registry" = "model"
"fid-store" = "model"
"fid-journal" = "model"
"fid-trust-canon" = "model"
"fid-project" = "model"
"fid-replay" = "engine"
"fid-bus" = "engine"
"fid-jobs" = "engine"
"fid-surface" = "services"
"fid-io-reg" = "services"
"fid-cli" = "app"
"fid-xtask" = "tool"
"fid-data" = "tool"
"fid-knp1-lint" = "tool"
"fid-eval-suite" = "tool"
"fid-qif-gen" = "tool"
"fid-agent" = "tool"
"fid-platform" = "tool"
"fid-testkit" = "test-support"
