# Metrology Maven OS end-of-support tracking (spec node PLAT.MATRIX.POLICY.EOL).
# Check with:  cargo xtask plat-matrix eol-check --today <YYYY-MM-DD>
#
# UNVERIFIED DATES: every vendor end-of-support date below is [unverified] until a maintainer
# verifies it directly against the linked vendor lifecycle page and removes this notice.
# Per decision D-010, Windows 10 remains eligible while enterprise extended security updates
# last, so its effective end date is `extended_until`.

schema_version = 1

[[entry]]
os = "ubuntu"
version = "26.04"
eol = "2031-04-30"
source = "https://ubuntu.com/about/release-cycle"

