# A manifest crate root that is also a library module: src/bin.rs is the `b` binary's root
# (mod-rs) and, through `mod bin;` in src/lib.rs, a non-mod-rs module of the library.
[package]
name = "knp1-syn-bin-root"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
exclude = ["src/bin/**"]

[[bin]]
name = "b"
path = "src/bin.rs"
