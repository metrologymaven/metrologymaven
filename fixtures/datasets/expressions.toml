# ECO.DATA.CAT fixture (expressions.toml). Synthetic entries only. MIT OR Apache-2.0.
[policy]
redistributable = ["CC0-1.0", "CC-BY-4.0", "CC-BY-SA-4.0", "MIT", "Apache-2.0", "BSD-3-Clause",
                   "ODbL-1.0", "PDDL-1.0"]

[[dataset]]
id = "or-licenseref"
title = "Synthetic dataset or-licenseref"
source = "https://example.org/datasets/or-licenseref"
licence = "MIT OR LicenseRef-Custom"
terms_url = "https://example.org/terms"
size_bytes = 1024
sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
owner = "KRN"
redistribution = "mirror"
urls = ["https://example.org/files/or-licenseref.zip"]

