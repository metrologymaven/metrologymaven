# ECO.DATA.CAT fixture (bad-digest.toml). Synthetic entries only. MIT OR Apache-2.0.
[policy]
redistributable = ["CC0-1.0", "CC-BY-4.0", "CC-BY-SA-4.0", "MIT", "Apache-2.0", "BSD-3-Clause",
                   "ODbL-1.0", "PDDL-1.0"]

[[dataset]]
