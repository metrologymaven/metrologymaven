[build]
target = "wasm32-wasip1"

[target.wasm32-wasip1]
rustflags = ["-C", "target-cpu=generic", "-C", "target-feature=-relaxed-simd,-simd128"]

[profile.kernel-artifact]
inherits = "release"
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = "abort"
incremental = false
codegen-units = 1
