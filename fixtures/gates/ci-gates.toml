# ECO.CI.GATES test configuration (hand-written; MIT OR Apache-2.0).
# No [isolation] table, so the planner's default ci_globs apply (.github/workflows/**,
# .github/actions/**, ci/**). [shared] mirrors the repository's ci-gates.toml, so a CI-only or
# Cargo.lock change selects every gate. The default tool_globs (xtask/**) are tested through
# the library; ci-gates-always.toml sets its own.

[shared]
tool_globs = ["xtask/**", ".github/workflows/**", ".github/actions/**", "ci/**", "Cargo.lock"]

[[gate]]
id = "spec"
run = "python tools/scope.py check"
globs = ["spec/**", "seeds/**", "decisions/**"]

[[gate]]
id = "layers"
run = "cargo xtask layers"
globs = ["layers.toml", "kernel-allowlist.toml", "**/Cargo.toml", "Cargo.lock"]

[[gate]]
id = "rules"
run = "python -m house_rules check"
globs = ["AGENTS.md", "CLAUDE.md", "house-rules/**"]

[[gate]]
id = "apps"
run = "cargo xtask apps-check --list apps.toml"
globs = ["apps.toml"]
